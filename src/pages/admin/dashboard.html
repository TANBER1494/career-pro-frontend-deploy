<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - CareerPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
      body { font-family: "Poppins", sans-serif; }
    </style>
  </head>
  <body class="bg-gray-50 flex h-screen overflow-hidden">
    
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
      <div class="h-16 flex items-center justify-center border-b border-slate-800">
        <h1 class="text-xl font-bold tracking-wider text-blue-400">
          <i class="fas fa-shield-halved mr-2"></i>Admin Panel
        </h1>
      </div>

      <nav class="flex-1 py-6 space-y-2 px-3">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white shadow-lg shadow-blue-500/30 transition-all">
          <i class="fas fa-chart-line w-5"></i>
          <span class="font-medium">Dashboard</span>
        </a>
        <a href="users.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-users w-5"></i>
          <span class="font-medium">Users</span>
        </a>
        <a href="jobs.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-briefcase w-5"></i>
          <span class="font-medium">Jobs</span>
        </a>
        <a href="verifications.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-certificate w-5"></i>
          <span class="font-medium">Verifications</span>
          <span id="nav-pending-badge" class="ml-auto bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
        </a>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <button id="logoutBtn" class="flex items-center gap-3 w-full px-4 py-2 text-red-400 hover:bg-slate-800 rounded-lg transition-colors">
          <i class="fas fa-sign-out-alt"></i>
          <span class="font-medium">Logout</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative">
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
        <h2 class="text-xl font-bold text-gray-800">System Overview</h2>
        <div class="flex items-center gap-4">
          <div class="text-right">
            <p class="text-sm font-bold text-gray-900">Administrator</p>
            <p class="text-xs text-gray-500">Super User</p>
          </div>
          <div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold">
            A
          </div>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-8">
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
          
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative overflow-hidden group hover:shadow-md transition-all">
            <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
              <i class="fas fa-user-graduate text-6xl text-blue-600"></i>
            </div>
            <p class="text-sm text-gray-500 font-medium">Total Job Seekers</p>
            <h3 id="stat-seekers" class="text-3xl font-bold text-gray-800 mt-2">...</h3>
            <div class="mt-4 flex items-center text-xs text-green-600 font-medium bg-green-50 w-fit px-2 py-1 rounded">
              <i class="fas fa-arrow-up mr-1"></i> Active Users
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative overflow-hidden group hover:shadow-md transition-all">
            <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
              <i class="fas fa-building text-6xl text-purple-600"></i>
            </div>
            <p class="text-sm text-gray-500 font-medium">Registered Companies</p>
            <h3 id="stat-companies" class="text-3xl font-bold text-gray-800 mt-2">...</h3>
            <div class="mt-4 flex items-center text-xs text-purple-600 font-medium bg-purple-50 w-fit px-2 py-1 rounded">
              <i class="fas fa-check-circle mr-1"></i> Partners
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative overflow-hidden group hover:shadow-md transition-all">
            <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
              <i class="fas fa-briefcase text-6xl text-emerald-600"></i>
            </div>
            <p class="text-sm text-gray-500 font-medium">Total Jobs Posted</p>
            <h3 id="stat-jobs" class="text-3xl font-bold text-gray-800 mt-2">...</h3>
            <div class="mt-4 flex items-center text-xs text-emerald-600 font-medium bg-emerald-50 w-fit px-2 py-1 rounded">
              <i class="fas fa-globe mr-1"></i> Live Opportunities
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-sm border border-orange-100 relative overflow-hidden group hover:shadow-md transition-all">
            <div class="absolute right-0 top-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
              <i class="fas fa-file-contract text-6xl text-orange-600"></i>
            </div>
            <p class="text-sm text-gray-500 font-medium">Pending Verifications</p>
            <h3 id="stat-pending" class="text-3xl font-bold text-orange-600 mt-2">...</h3>
            <div class="mt-4 flex items-center text-xs text-orange-600 font-medium bg-orange-50 w-fit px-2 py-1 rounded cursor-pointer hover:bg-orange-100 transition" onclick="window.location.href='verifications.html'">
              <i class="fas fa-exclamation-circle mr-1"></i> Review Now
            </div>
          </div>

        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Quick Actions</h3>
            <div class="flex gap-4">
                <a href="users.html" class="flex-1 bg-slate-50 hover:bg-slate-100 p-4 rounded-lg border border-slate-200 text-center transition">
                    <i class="fas fa-user-shield text-slate-500 mb-2 text-xl"></i>
                    <p class="font-medium text-sm">Manage Users</p>
                </a>
                <a href="jobs.html" class="flex-1 bg-slate-50 hover:bg-slate-100 p-4 rounded-lg border border-slate-200 text-center transition">
                    <i class="fas fa-list-check text-slate-500 mb-2 text-xl"></i>
                    <p class="font-medium text-sm">Review Jobs</p>
                </a>
            </div>
        </div>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../../js/controllers/adminDashboardController.js"></script>
  </body>
</html>

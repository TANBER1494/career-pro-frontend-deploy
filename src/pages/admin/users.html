<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
      body { font-family: "Poppins", sans-serif; }
      .tab-active {
        border-bottom: 2px solid #2563eb;
        color: #2563eb;
        font-weight: 600;
      }
      .tab-inactive {
        color: #64748b;
        font-weight: 500;
      }
      .tab-inactive:hover {
        color: #1e293b;
      }
    </style>
  </head>
  <body class="bg-gray-50 flex h-screen overflow-hidden">
    
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
      <div class="h-16 flex items-center justify-center border-b border-slate-800">
        <h1 class="text-xl font-bold tracking-wider text-blue-400">
          <i class="fas fa-shield-halved mr-2"></i>Admin Panel
        </h1>
      </div>

      <nav class="flex-1 py-6 space-y-2 px-3">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-chart-line w-5"></i>
          <span class="font-medium">Dashboard</span>
        </a>
        
        <a href="users.html" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white shadow-lg shadow-blue-500/30 transition-all">
          <i class="fas fa-users w-5"></i>
          <span class="font-medium">Users</span>
        </a>

        <a href="jobs.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-briefcase w-5"></i>
          <span class="font-medium">Jobs</span>
        </a>

        <a href="verifications.html" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-certificate w-5"></i>
          <span class="font-medium">Verifications</span>
        </a>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <button id="logoutBtn" class="flex items-center gap-3 w-full px-4 py-2 text-red-400 hover:bg-slate-800 rounded-lg transition-colors">
          <i class="fas fa-sign-out-alt"></i>
          <span class="font-medium">Logout</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative">
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
        <h2 class="text-xl font-bold text-gray-800">User Management</h2>
        <div class="flex items-center gap-4">
          <div class="text-right">
            <p class="text-sm font-bold text-gray-900">Administrator</p>
          </div>
          <div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold">A</div>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-8">
        
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
            
            <div class="flex border-b border-gray-200 mb-4">
                <button id="tab-seekers" class="tab-active px-6 py-2 transition-all focus:outline-none">
                    <i class="fas fa-user-graduate mr-2"></i> Job Seekers
                </button>
                <button id="tab-companies" class="tab-inactive px-6 py-2 transition-all focus:outline-none">
                    <i class="fas fa-building mr-2"></i> Companies
                </button>
            </div>

            <div class="flex justify-between items-center">
                <div class="relative w-96">
                    <input type="text" id="searchInput" placeholder="Search by name..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                </div>
                <button id="refreshBtn" class="text-gray-500 hover:text-blue-600 transition"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs font-bold">
                    <tr id="tableHeaderRow">
                        </tr>
                </thead>
                <tbody id="usersTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin mr-2"></i> Loading users...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="../../js/controllers/adminUsersController.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Verification - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
      body { font-family: "Poppins", sans-serif; }
    </style>
  </head>
  <body class="bg-gray-50 flex h-screen overflow-hidden">
    
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-20">
      <div class="h-16 flex items-center justify-center border-b border-slate-800">
        <h1 class="text-xl font-bold tracking-wider text-blue-400">
          <i class="fas fa-shield-halved mr-2"></i>Admin Panel
        </h1>
      </div>

      <nav class="flex-1 py-6 space-y-2 px-3">
        <a href="/admin" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-chart-line w-5"></i>
          <span class="font-medium">Dashboard</span>
        </a>
        <a href="/admin/users" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-users w-5"></i>
          <span class="font-medium">Users</span>
        </a>
        <a href="/admin/jobs" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all">
          <i class="fas fa-briefcase w-5"></i>
          <span class="font-medium">Jobs</span>
        </a>
        
        <a href="/admin/verifications" class="flex items-center gap-3 px-4 py-3 bg-blue-600 rounded-lg text-white shadow-lg shadow-blue-500/30 transition-all">
          <i class="fas fa-certificate w-5"></i>
          <span class="font-medium">Verifications</span>
        </a>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <button id="logoutBtn" class="flex items-center gap-3 w-full px-4 py-2 text-red-400 hover:bg-slate-800 rounded-lg transition-colors">
          <i class="fas fa-sign-out-alt"></i>
          <span class="font-medium">Logout</span>
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden relative">
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm">
        <h2 class="text-xl font-bold text-gray-800">Verification Requests</h2>
        <div class="flex items-center gap-4">
            <select id="statusFilter" class="bg-gray-50 border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                <option value="pending" selected>Pending Review</option>
                <option value="approved">Approved History</option>
                <option value="rejected">Rejected History</option>
            </select>

            <div class="w-px h-6 bg-gray-300 mx-2"></div>

            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-sm font-bold text-gray-900">Administrator</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center font-bold">A</div>
            </div>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-8">
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs font-bold">
                    <tr>
                        <th class="px-6 py-4">Company</th>
                        <th class="px-6 py-4">Document</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Submitted At</th>
                        <th class="px-6 py-4 text-right">Decision</th>
                    </tr>
                </thead>
                <tbody id="verificationsTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                            <i class="fas fa-spinner fa-spin mr-2"></i> Loading requests...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script type="module" src="../../js/controllers/adminVerificationsController.js"></script>
  </body>
</html>

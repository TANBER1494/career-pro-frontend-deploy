<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../../css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script type="module" src="/src/js/controllers/DarkModeController.js"></script>
    <link rel="website icon" type="png" href="../../../assets/imgs/Logo.png"/>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #B6CEE0;
        background: radial-gradient(circle, rgba(182, 206, 224, 1) 0%, rgba(255, 255, 255, 1) 65%);
        margin: 0;
        padding: 0;
      }
      .toggleSwitch {
  width: 56px;
  height: 56px;
  display: grid;
  border-radius: 50%;
  position: relative;
  place-items: center;
  cursor: pointer;
  transition: transform 0.2s ease;
  line-height: 1;
  overflow: hidden;
}

#checkboxInput {
  display: none;
}

.icons {
  grid-column: 1 / 1;
  grid-row: 1 / 1;
  width: 80%;
  height: 80%;
  display: grid;
  place-items: center;
  z-index: 2;
  transform-origin: center center;
  transition:
    transform 500ms ease,
    opacity 300ms ease;
  opacity: 0;
  pointer-events: none;
}

.icons--moon {
  color: #222222;
  /* background-color: #e8e8e8; */
  border-radius: 50%;
}
.icons--sun {
  color: #ffa600;
  border-radius: 50%;
}
.dark .icons--sun {
  color: #ffa600;
  filter: drop-shadow(0 0 5px #ffa600) drop-shadow(0 0 8px rgba(255, 166, 0, 0.6));
}
.icons--moon,
.icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--sun {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--moon {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:checked + .toggleSwitch .icons--moon {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:checked + .toggleSwitch .icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:active + .toggleSwitch {
  transform: scale(0.94);
}
.icons svg {
  fill: currentColor !important;
}
#light-rays-container {
    display: none !important;
}

/* لما يكون فيه كلاس dark على الـ body أو الـ html */
.dark #light-rays-container {
    display: block !important;
}
    </style>
  </head>
  <body
  class="bg-gray-50 min-h-screen flex items-center justify-center font-sans overflow-y-auto py-12 relative text-gray-800"
  >
  <a
  href="/CareerPro"
      class="absolute top-4 left-8 z-20 flex items-center gap-2 text-slate-500 dark:text-slate-300 hover:text-blue-600 dark:hover:text-slate-200 font-bold transition-colors mt-6 ml-6 mb-10 group "
      >
      <i class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"></i>
      <span>AI-Career Guidance</span>
    </a>
    <div class="absolute top-4 right-8 z-20">
      <input id="checkboxInput" type="checkbox" />
      <label class="toggleSwitch" for="checkboxInput">
      <div class="icons icons--moon">
        <svg
          class="moon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          width="32"
          height="32"
        >
          <path
            fill-rule="evenodd"
            d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"
            clip-rule="evenodd"
          ></path>
        </svg>
      </div>
    
      <div class="icons icons--sun">
        <svg
          class="sun"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          width="32"
          height="32"
        >
          <path
          d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"
          ></path>
        </svg>
      </div>
    </label>
    </div>
    <div id="light-rays-container" class="fixed inset-0 w-full h-full hidden bg-indigo-950 z-0 dark:block"></div>

    <div
      class="bg-white dark:bg-black/30 p-8 z-20 rounded-2xl shadow-lg border border-gray-100 dark:border-gray-800 w-full max-w-md text-center"
    >
      <div
        class="w-16 h-16 bg-blue-50 dark:bg-black/30 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500 text-2xl"
      >
        <i class="fas fa-lock-open"></i>
      </div>

      <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-200 mb-2">Forgot Password?</h2>
      <p class="text-gray-500 text-sm mb-6">
        Enter your email address and we'll send you a link to reset your
        password.
      </p>

      <form id="forgotForm" class="space-y-4">
        <div class="text-left">
          <label class="block text-xs font-bold text-gray-700 dark:text-gray-400 mb-1"
            >Email Address</label
          >
          <div class="relative">
            <input
              type="email"
              id="email"
              required
              placeholder="name@example.com"
              class="w-full px-4 py-3 border dark:text-white border-slate-300 dark:border-slate-600 rounded-lg dark:bg-black/30 dark:focus:border-slate-200 dark:focus:ring-white/50 dark:caret-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 pl-10"
            />
            <i
              class="far fa-envelope absolute left-3 top-3.5 text-gray-400"
            ></i>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md"
        >
          Send Reset Link
        </button>
      </form>

      <div class="mt-6 text-sm text-gray-500">
        Remember your password?
        <a
          href="/login"
          class="text-blue-600 font-bold hover:underline"
          >Log in</a
        >
      </div>
    </div>
    <script type="module" src="/src/js/utils/authGuard.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script
      type="module"
      src="../../js/controllers/passwordResetController.js"
    ></script>
  </body>
</html>

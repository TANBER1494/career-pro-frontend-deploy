<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="../../css/main.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="website icon" type="png" href="../../../assets/imgs/Logo.png"/>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #B6CEE0;
        background: radial-gradient(circle, rgba(182, 206, 224, 1) 0%, rgba(255, 255, 255, 1) 65%);
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <a
      href="/CareerPro"
      class="absolute top-4 left-8 flex items-center gap-2 text-gray-600 hover:text-blue-600 font-bold transition-colors mt-6 ml-6 mb-10 group "
    >
      <i class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"></i>
      <span>AI-Career Guidance</span>
    </a>
    <div
      class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 w-full max-w-md text-center"
    >
      <div
        class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4 text-blue-500 text-2xl"
      >
        <i class="fas fa-lock-open"></i>
      </div>

      <h2 class="text-2xl font-bold text-gray-800 mb-2">Forgot Password?</h2>
      <p class="text-gray-500 text-sm mb-6">
        Enter your email address and we'll send you a link to reset your
        password.
      </p>

      <form id="forgotForm" class="space-y-4">
        <div class="text-left">
          <label class="block text-xs font-bold text-gray-700 mb-1"
            >Email Address</label
          >
          <div class="relative">
            <input
              type="email"
              id="email"
              required
              placeholder="name@example.com"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 pl-10"
            />
            <i
              class="far fa-envelope absolute left-3 top-3.5 text-gray-400"
            ></i>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-md"
        >
          Send Reset Link
        </button>
      </form>

      <div class="mt-6 text-sm text-gray-500">
        Remember your password?
        <a
          href="/login"
          class="text-blue-600 font-bold hover:underline"
          >Log in</a
        >
      </div>
    </div>
    <script type="module" src="/src/js/utils/authGuard.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script
      type="module"
      src="../../js/controllers/passwordResetController.js"
    ></script>
  </body>
</html>

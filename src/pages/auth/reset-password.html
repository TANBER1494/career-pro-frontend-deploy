<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="stylesheet" href="../../css/main.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="website icon" type="png" href="../../../assets/imgs/Logo.png"/>
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div
      class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 w-full max-w-md text-center"
    >
      <div
        class="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-4 text-green-500 text-2xl"
      >
        <i class="fas fa-key"></i>
      </div>

      <h2 class="text-2xl font-bold text-gray-800 mb-2">Set New Password</h2>
      <p class="text-gray-500 text-sm mb-6">
        Your new password must be different from previous used passwords.
      </p>

      <form id="resetForm" class="space-y-4">
        <div class="text-left">
          <label class="block text-xs font-bold text-gray-700 mb-1"
            >New Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="password"
              required
              placeholder="••••••••"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 pl-10"
            />
            <i class="fas fa-lock absolute left-3 top-3.5 text-gray-400"></i>
          </div>
        </div>

        <div class="text-left">
          <label class="block text-xs font-bold text-gray-700 mb-1"
            >Confirm Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="passwordConfirm"
              required
              placeholder="••••••••"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 pl-10"
            />
            <i class="fas fa-lock absolute left-3 top-3.5 text-gray-400"></i>
          </div>
        </div>

        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition shadow-md mt-2"
        >
          Reset Password
        </button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script
      type="module"
      src="../../js/controllers/passwordResetController.js"
    ></script>
  </body>
</html>

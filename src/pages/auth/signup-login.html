    <style>
      body{
      background: #B6CEE0;
      background: radial-gradient(circle, rgba(182, 206, 224, 1) 0%, rgba(255, 255, 255, 1) 65%);
      margin: 0;
      padding: 0;
      }

      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      .rotate-y-180-default {
        transform: rotateY(180deg);
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      .toggleSwitch {
  width: 56px;
  height: 56px;
  display: grid;
  border-radius: 50%;
  position: relative;
  place-items: center;
  cursor: pointer;
  transition: transform 0.2s ease;
  line-height: 1;
  overflow: hidden;
}

#checkboxInput {
  display: none;
}

.icons {
  grid-column: 1 / 1;
  grid-row: 1 / 1;
  width: 80%;
  height: 80%;
  display: grid;
  place-items: center;
  z-index: 2;
  transform-origin: center center;
  transition:
    transform 500ms ease,
    opacity 300ms ease;
  opacity: 0;
  pointer-events: none;
}

.icons--moon {
  color: #222222;
  /* background-color: #e8e8e8; */
  border-radius: 50%;
}
.icons--sun {
  color: #ffa600;
  border-radius: 50%;
}
.dark .icons--sun {
  color: #ffa600;
  filter: drop-shadow(0 0 5px #ffa600) drop-shadow(0 0 8px rgba(255, 166, 0, 0.6));
}
.icons--moon,
.icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--sun {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--moon {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:checked + .toggleSwitch .icons--moon {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:checked + .toggleSwitch .icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:active + .toggleSwitch {
  transform: scale(0.94);
}
.icons svg {
  fill: currentColor !important;
}
#light-rays-container {
    display: none !important;
}

/* لما يكون فيه كلاس dark على الـ body أو الـ html */
.dark #light-rays-container {
    display: block !important;
}
    </style>

<script type="module">
  // 1. أولاً: استيراد المكتبة
  import { Renderer, Program, Triangle, Mesh } from 'https://cdn.skypack.dev/ogl';

  // 2. ثانياً: تعريف الدالة (مرة واحدة بس وبشكل صحيح)
  function initRays(selector) {
    const container = document.querySelector(selector);
    if (!container) return;

    // إعدادات الخلفية
    const config = {
      raysColor: '#ffffff',
        raysSpeed: 0.5,      // قللت السرعة كمان عشان تكون أهدى
        lightSpread: 0.4,    // كانت 0.5 - تقليل الانتشار بيضعف الإضاءة
        rayLength: 1,      // كانت 3 - كده الشعاع هيقصر جداً ومش هيملى الشاشة كلها
        mouseInfluence: 0.05
    };

    const hexToRgb = hex => {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return m ? [parseInt(m[1], 16) / 255, parseInt(m[2], 16) / 255, parseInt(m[3], 16) / 255] : [1, 1, 1];
    };

    const renderer = new Renderer({ dpr: Math.min(window.devicePixelRatio, 2), alpha: true });
    const gl = renderer.gl;
    container.appendChild(gl.canvas);

    const vert = `attribute vec2 position;varying vec2 vUv;void main(){vUv=position*0.5+0.5;gl_Position=vec4(position,0.0,1.0);}`;
    const frag = `
      precision highp float;
      uniform float iTime;
      uniform vec2 iResolution;
      uniform vec3 raysColor;
      uniform float lightSpread;
      uniform float rayLength;
      
      float rayStrength(vec2 source, vec2 dir, vec2 coord, float currentSpread) {
        vec2 toCoord = coord - source;
        float cosAngle = dot(normalize(toCoord), dir);
        // التغيير هنا: استخدمنا currentSpread المتحرك
        float spread = pow(max(cosAngle, 0.0), 1.0 / max(currentSpread, 0.001));
        float dist = length(toCoord);
        float falloff = clamp((iResolution.x * rayLength - dist) / (iResolution.x * rayLength), 0.0, 1.0);
        return spread * falloff;
      }

      void main() {
        vec2 coord = vec2(gl_FragCoord.x, iResolution.y - gl_FragCoord.y);
        vec2 rayPos = vec2(iResolution.x * 0.5, -iResolution.y * 0.2);
        
        // 1. حركة الأنيميشن: جعل الأشعة تتمايل يميناً ويساراً
        float move = sin(iTime * 0.8) * 0.15; 
        vec2 rayDir = normalize(vec2(move, 1.0));
        
        // 2. حركة خفيفة في انتشار الضوء (كأنه نبض)
        float dynamicSpread = lightSpread + sin(iTime * 1.5) * 0.05;

        float s = rayStrength(rayPos, rayDir, coord, dynamicSpread);
        gl_FragColor = vec4(raysColor * s, s * 0.8);
      }
    `;

    const uniforms = {
      iTime: { value: 0 },
      iResolution: { value: [0, 0] },
      raysColor: { value: hexToRgb(config.raysColor) },
      lightSpread: { value: config.lightSpread },
      rayLength: { value: config.rayLength },
      mousePos: { value: [0.5, 0.5] },
      mouseInfluence: { value: config.mouseInfluence }
    };

    const geometry = new Triangle(gl);
    const program = new Program(gl, { vertex: vert, fragment: frag, uniforms, transparent: true });
    const mesh = new Mesh(gl, { geometry, program });

    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      uniforms.iResolution.value = [w * renderer.dpr, h * renderer.dpr];
    }
    window.addEventListener('resize', resize);
    resize();

    function update(t) {
      if (getComputedStyle(container).display === 'none') {
        requestAnimationFrame(update);
        return; 
    }

    uniforms.iTime.value = t * 0.001;
    renderer.render({ scene: mesh });
    requestAnimationFrame(update);
    }
    requestAnimationFrame(update);
  }

  // 3. ثالثاً: تشغيل الدالة
  initRays('#light-rays-container');
</script>
    <script type="module" src="../../js/controllers/authController.js"></script>
    <script>
      function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
          input.type = "text";
          icon.classList.remove("fa-eye");
          icon.classList.add("fa-eye-slash");
        } else {
          input.type = "password";
          icon.classList.remove("fa-eye-slash");
          icon.classList.add("fa-eye");
        }
      }

      function updateCardHeight(isSignup) {
        const container = document.getElementById("mainContainer");
        const front = document.getElementById("frontFace");
        const back = document.getElementById("backFace");

        // هنا بنحسب الطول الجديد
        // الجافاسكريبت هيحط الطول ده للكونتينر
        // ال CSS transition هو اللي هيخلي الطول ده يتطبق بنعومة
        if (isSignup) {
          container.style.height = back.scrollHeight + "px";
        } else {
          container.style.height = front.scrollHeight + "px";
        }
      }

      function flipCard() {
        const cardInner = document.getElementById("cardInner");
        const isGoingToSignup = !cardInner.classList.contains("rotate-y-180");

        // 1. لف الكارد
        cardInner.classList.toggle("rotate-y-180");

        // 2. غير الطول فوراً عشان الانيميشن يبدأ مع اللف
        updateCardHeight(isGoingToSignup);
      }

      function toggleAccountType(type) {
        const select = document.getElementById("accountType");
        const jobFields = document.getElementById("jobSeekerFields");
        const compFields = document.getElementById("companyFields");
        const firstNameInput = document.getElementById("firstName");
        const lastNameInput = document.getElementById("lastName");
        const companyNameInput = document.getElementById("companyName");

        select.value = type;
        select.dispatchEvent(new Event("change"));

        if (type === "company") {
          jobFields.classList.add("hidden");
          compFields.classList.remove("hidden");
          companyNameInput.setAttribute("required", "");
          firstNameInput.removeAttribute("required");
          lastNameInput.removeAttribute("required");
        } else {
          jobFields.classList.remove("hidden");
          compFields.classList.add("hidden");
          companyNameInput.removeAttribute("required");
          firstNameInput.setAttribute("required", "");
          lastNameInput.setAttribute("required", "");
        }

        setTimeout(() => {
          const isSignup = document
            .getElementById("cardInner")
            .classList.contains("rotate-y-180");
          updateCardHeight(isSignup);
        }, 50);
      }

      window.addEventListener("resize", () => {
        const cardInner = document.getElementById("cardInner");
        const isSignup = cardInner.classList.contains("rotate-y-180");
        updateCardHeight(isSignup);
      });

      window.addEventListener("DOMContentLoaded", () => {
        const cardInner = document.getElementById("cardInner");
        const container = document.getElementById("mainContainer");

        // 1. قراءة المود من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get("mode");

        // 2. تطبيق الوضع المبدئي (بدون أنيميشن نهائيًا)
        if (mode === "signup") {
          // نلف الكارد فوراً (بما اننا شيلنا ال transition من ال HTML، اللفة هتكون لحظية)
          cardInner.classList.add("rotate-y-180");
          toggleAccountType("job_seeker");
          updateCardHeight(true);
        } else {
          cardInner.classList.remove("rotate-y-180");
          toggleAccountType("job_seeker");
          updateCardHeight(false);
        }

        // 🔥 السطر السحري (Force Reflow)
        // السطر ده بيجبر المتصفح انه "يعتمد" الوضع الحالي (سواء مقلوب او معدول) كأنه الوضع الاصلي
        // قبل ما نضيف اي انيميشن
        void cardInner.offsetWidth;

        // 3. دلوقتي بس نضيف كلاسات الأنيميشن للجافاسكريبت
        // عشان لما اليوزر يدوس بعد كدة، يلف بنعومة
        cardInner.classList.add(
          "transition-all",
          "duration-700",
          "ease-in-out"
        );
        container.classList.add(
          "transition-all",
          "duration-500",
          "ease-in-out"
        );
      });
    </script>
  </body>
</html>

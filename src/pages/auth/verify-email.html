<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - CareerPro</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">

    <main class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl m-4 relative">
        
        <a href="signup.html" class="absolute top-6 left-6 text-gray-500 hover:text-blue-600 transition-colors flex items-center gap-2 text-sm font-medium no-underline">
            <i class="fas fa-arrow-left"></i> Back
        </a>

        <div class="text-center mt-8 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Verify Your Email</h2>
            <p class="text-gray-500 text-sm">
                We sent a 6-digit code to <br>
                <span id="userEmailDisplay" class="font-bold text-gray-800">your email</span>
            </p>
        </div>

        <form id="verifyForm" class="space-y-6">
            
            <div class="flex justify-center gap-2" id="otp-container">
                <input type="text" maxlength="1" class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" autofocus>
                <input type="text" maxlength="1" class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                <input type="text" maxlength="1" class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                <input type="text" maxlength="1" class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                <input type="text" maxlength="1" class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                <input type="text" maxlength="1" class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
            </div>

            <input type="hidden" id="verificationCode">

            <button type="submit" class="w-full bg-blue-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-600 focus:ring-4 focus:ring-blue-200 transition-all shadow-lg">
                Verify & Continue
            </button>

            <div class="text-center text-sm text-gray-500 mt-4">
                Didn't receive the code? 
                <button type="button" id="resendBtn" class="text-blue-500 font-bold hover:underline bg-transparent border-none cursor-pointer ml-1">
                    Resend Code
                </button>
                <p id="resendMessage" class="mt-2 text-xs hidden"></p>
            </div>

        </form>
    </main>

    <script type="module" src="../../js/controllers/authController.js"></script>

    <script>
        // 1. عرض الإيميل المستخدم
        const email = localStorage.getItem('tempEmail');
        if (email) {
            document.getElementById('userEmailDisplay').textContent = email;
        }

        // 2. منطق التنقل بين الخانات (OTP Logic)
        const inputs = document.querySelectorAll('.otp-input');
        const hiddenInput = document.getElementById('verificationCode');

        inputs.forEach((input, index) => {
            // الانتقال للخانة التالية عند الكتابة
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                
                // السماح بأرقام فقط
                if (isNaN(val)) {
                    e.target.value = "";
                    return;
                }

                if (val !== "") {
                    // نقل التركيز للخانة التالية
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
                updateHiddenInput();
            });

            // التعامل مع زر المسح (Backspace)
            input.addEventListener('keydown', (e) => {
                if (e.key === "Backspace") {
                    if (input.value === "" && index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });

            // التعامل مع اللصق (Paste) - لو اليوزر نسخ الكود كله
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text');
                // نوزع الأرقام على الخانات
                const digits = pasteData.split('').slice(0, inputs.length);
                
                digits.forEach((digit, i) => {
                    inputs[i].value = digit;
                });
                
                // نركز على آخر خانة
                if (digits.length > 0) {
                    inputs[Math.min(digits.length, inputs.length) - 1].focus();
                }
                updateHiddenInput();
            });
        });

        // دالة لتجميع الأرقام في الحقل المخفي
        function updateHiddenInput() {
            let code = "";
            inputs.forEach(input => {
                code += input.value;
            });
            hiddenInput.value = code; // ده اللي auth.js هيقراه
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="website icon" type="png" href="../../../assets/imgs/Logo.png"/>
    <style>
      body{
      background: #B6CEE0;
      background: radial-gradient(circle, rgba(182, 206, 224, 1) 0%, rgba(255, 255, 255, 1) 65%);
      margin: 0;
      padding: 0;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 min-h-screen flex items-center justify-center font-sans"
  >
    <main
      class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl m-4 relative"
    >
      <a
        href="/login"
        class="absolute top-6 left-6 text-gray-500 hover:text-blue-600 transition-colors flex items-center gap-2 text-sm font-medium no-underline"
      >
        <i class="fas fa-arrow-left"></i> Back
      </a>

      <div class="text-center mt-8 mb-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Verify Your Email</h2>
        <p class="text-gray-500 text-sm">
          We sent a 6-digit code to <br />
          <span id="userEmailDisplay" class="font-bold text-gray-800"
            >your email</span
          >
        </p>
      </div>

      <form id="verifyForm" class="space-y-6">
        <div class="flex justify-center gap-2" id="otp-container">
          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
            autofocus
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
          <input
            type="text"
            maxlength="1"
            class="otp-input w-12 h-12 border border-gray-300 rounded-lg text-center text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          />
        </div>

        <input type="hidden" id="verificationCode" />

        <button
          type="submit"
          class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition-all shadow-lg cursor-pointer"
        >
          Verify & Continue
        </button>

        <div class="text-center text-sm text-gray-500 mt-4">
          Didn't receive the code?
          <button
            type="button"
            id="resendBtn"
            class="text-blue-600 font-bold hover:underline bg-transparent border-none cursor-pointer ml-1"
          >
            Resend Code
          </button>
        </div>
      </form>
    </main>
    <script type="module" src="/src/js/utils/authGuard.js"></script>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script type="module" src="/src/js/services/authService.js"></script>

    <script
      type="module"
      src="/src/js/controllers/verifyEmailController.js"
    ></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 1. عرض الإيميل
        const email =
          localStorage.getItem("pendingVerificationEmail") ||
          localStorage.getItem("tempEmail");
        if (email) {
          const emailDisplay = document.getElementById("userEmailDisplay");
          if (emailDisplay) emailDisplay.textContent = email;
        }

        // 2. منطق الـ OTP Input
        const inputs = document.querySelectorAll(".otp-input");
        const hiddenInput = document.getElementById("verificationCode");

        inputs.forEach((input, index) => {
          input.addEventListener("input", (e) => {
            const val = e.target.value;
            if (isNaN(val)) {
              e.target.value = "";
              return;
            }
            if (val !== "") {
              if (index < inputs.length - 1) inputs[index + 1].focus();
            }
            updateHiddenInput();
          });

          input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && input.value === "" && index > 0) {
              inputs[index - 1].focus();
            }
          });

          // Paste Logic
          input.addEventListener("paste", (e) => {
            e.preventDefault();
            const data = e.clipboardData
              .getData("text")
              .slice(0, inputs.length);
            data.split("").forEach((char, i) => (inputs[i].value = char));
            updateHiddenInput();
            if (inputs[data.length - 1]) inputs[data.length - 1].focus();
          });
        });

        function updateHiddenInput() {
          let code = "";
          inputs.forEach((input) => (code += input.value));
          if (hiddenInput) hiddenInput.value = code;
        }
      });
    </script>
  </body>
</html>

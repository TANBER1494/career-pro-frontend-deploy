      body {

        transition: opacity 0.5s ease-in-out;

        );

        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }
      .dark body {
        transition: opacity 0.5s ease-in-out;
        background: #110b36;
        background: linear-gradient(131deg,rgba(17, 11, 54, 1) 0%, rgba(38, 42, 102, 1) 35%, rgba(55, 31, 89, 1) 100%);
      }
      .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-right: 100px;
      }
      .magic-menu {
        display: flex;
        position: relative;
        gap: 15px; /* قللنا المسافة بين الايقونات شوية */
        align-items: center;
        padding: 0 10px;
      }
      .dark .magic-menu li {
        background: rgba(126, 126, 126, 0.37);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .magic-menu li {
        position: relative;
        list-style: none;
        width: 42px; /* تصغير العرض (كان 50) */
        height: 42px; /* تصغير الطول (كان 50) */
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 60px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }.dark .magic-menu li {
        background: rgba(126, 126, 126, 0.37);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      /* ... (before & after كما هما) ... */
      .magic-menu li::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        opacity: 0;
        transition: 0.5s;
      }
      .magic-menu li::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        transition: 0.5s;
        filter: blur(15px);
        z-index: -1;
        opacity: 0;
      }
      .dark .magic-menu li ion-icon {
        color: #ddd9d9;
      }
      /* Hover State */
      .magic-menu li:hover,
      .magic-menu li.active {
        width: 130px; /* تصغير عرض التمدد قليلاً */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
      }
      .magic-menu li:hover::before,
      .magic-menu li.active::before {
        opacity: 1;
      }
      .magic-menu li:hover::after,
      .magic-menu li.active::after {
        opacity: 0.5;
      }

      .magic-menu li ion-icon {
        color: #777;
        font-size: 1.3em; /* تصغير حجم الايقونة لتناسب الدائرة الجديدة */
        transition: 0.5s;
        transition-delay: 0.25s;
      }
      .dark .magic-menu li ion-icon {
        color: #ddd9d9;
      }
      /* ... باقي الستايل كما هو ... */
      .magic-menu li:hover ion-icon,
      .magic-menu li.active ion-icon {
        transform: scale(0);
        color: #fff;
        transition-delay: 0s;
      }
      .dark .magic-menu li:hover ion-icon,
      .dark .magic-menu li.active ion-icon {
        color: #030303;
      }
      .magic-menu li span.title {
        position: absolute;
        color: #fff;
        font-size: 0.85em; /* تصغير الخط قليلاً */
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transform: scale(0);
        transition: 0.5s;
        transition-delay: 0s;
      }
      .magic-menu li:hover span.title,
      .magic-menu li.active span.title {
        transform: scale(1);
        transition-delay: 0.25s;
      }

/* From Uiverse.io by zenonaiden_3341 */ 
.toggleSwitch {
  width: 56px;
  height: 56px;
  display: grid;
  border-radius: 50%;
  position: relative;
  place-items: center;
  cursor: pointer;
  transition: transform 0.2s ease;
  line-height: 1;
  overflow: hidden;
  margin-left: 2%;
}

#checkboxInput {
  display: none;
}

.icons {
  grid-column: 1 / 1;
  grid-row: 1 / 1;
  width: 80%;
  height: 80%;
  display: grid;
  place-items: center;
  z-index: 2;
  transform-origin: center center;
  transition:
    transform 500ms ease,
    opacity 300ms ease;
  opacity: 0;
  pointer-events: none;
}

.icons--moon {
  color: #212121;
  /* background-color: #e8e8e8; */
  border-radius: 50%;
}
.icons--sun {
  color: #ffa600;
  /* background-color: #e8e8e8; */
  border-radius: 50%;
}
.dark .icons--sun {
  color: #ffa600;
  filter: drop-shadow(0 0 5px #ffa600) drop-shadow(0 0 6px rgba(255, 166, 0, 0.6));
}
.icons--moon,
.icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--sun {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--moon {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:checked + .toggleSwitch .icons--moon {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:checked + .toggleSwitch .icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:active + .toggleSwitch {
  transform: scale(0.94);
}
.icons svg {
  fill: currentColor !important;
}

  <script>
      // ✅ الحل: استخدام pageshow بدلاً من load
      // هذا الحدث يعمل حتى عند الضغط على زر Back
      window.addEventListener('pageshow', function(event) {
          // إذا كانت الصفحة مخفية (بسبب الانتقال السابق)، أظهرها فوراً
          document.body.classList.add('loaded');
      });

      const menuItems = document.querySelectorAll('.menu-item');
      menuItems.forEach(item => {
        item.addEventListener('click', function() {
          // فقط إذا كان الرابط مختلف عن الصفحة الحالية
          const targetPage = this.getAttribute('data-url');
          if (targetPage === window.location.pathname.split('/').pop()) return;

          document.body.classList.remove('loaded');
          setTimeout(() => {
            window.location.href = targetPage;
          }, 400);
        });
      });
    </script>

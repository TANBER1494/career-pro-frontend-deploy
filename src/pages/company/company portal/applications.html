<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applications Management - CareerPro</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body class="bg-gray-50 font-sans text-gray-800">
    <nav
      class="sticky top-0 z-50 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between"
    >
      <div class="flex items-center space-x-8">
        <a
          href="dashboard.html"
          class="text-xl font-bold text-cyan-600 flex items-center gap-2"
        >
          <i class="fas fa-building"></i> <span>Company Portal</span>
        </a>
        <div
          class="hidden md:flex items-center space-x-6 text-gray-600 font-medium"
        >
          <a href="dashboard.html" class="hover:text-cyan-600">Dashboard</a>
          <a href="profile.html" class="hover:text-cyan-600">Profile</a>
          <a href="jobs.html" class="hover:text-cyan-600">Jobs</a>
          <a
            href="applications.html"
            class="text-cyan-600 border-b-2 border-cyan-600 pb-1"
            >Applications</a
          >
          <a href="verification.html" class="hover:text-cyan-600"
            >Verification</a
          >
        </div>
      </div>
      <div>
        <button
          id="btnLogout"
          class="text-gray-600 hover:text-red-600 font-medium flex items-center gap-2"
        >
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">
            Applications Management
          </h1>
          <p class="text-gray-500 mt-1">Review and manage job applications</p>
        </div>
        <a
          href="jobs.html"
          class="text-gray-500 hover:text-cyan-600 text-sm font-medium flex items-center gap-1"
        >
          <i class="fas fa-briefcase"></i> View Jobs
        </a>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
        <div class="w-full">
          <div class="relative w-full">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Search candidates by name..."
              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition"
            />
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-cyan-600" id="stat-total">--</h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">Total</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-blue-600" id="stat-new">--</h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">New</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-yellow-500" id="stat-reviewing">
            --
          </h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">
            Reviewing
          </p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-purple-600" id="stat-interviewed">
            --
          </h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">
            Interviewed
          </p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-green-600" id="stat-hired">--</h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">Hired</p>
        </div>
      </div>

      <div id="applicationsContainer" class="space-y-4">
        <div class="text-center py-12 text-gray-500">
          <i class="fas fa-spinner fa-spin text-3xl mb-3 text-cyan-600"></i>
          <p>Loading applications...</p>
        </div>
      </div>

      <div
        class="flex items-center justify-between pt-4 border-t border-gray-200"
      >
        <button
          id="prevPage"
          class="px-4 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed text-sm font-medium transition"
        >
          <i class="fas fa-chevron-left mr-1"></i> Previous
        </button>
        <span id="pageInfo" class="text-sm text-gray-600">Page 1</span>
        <button
          id="nextPage"
          class="px-4 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed text-sm font-medium transition"
        >
          Next <i class="fas fa-chevron-right ml-1"></i>
        </button>
      </div>
    </main>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
    ></script>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script type="module" src="/src/js/services/applicationService.js"></script>
    <script
      type="module"
      src="/src/js/services/jobManagementService.js"
    ></script>

    <script
      type="module"
      src="/src/js/controllers/applicationsController.js"
    ></script>
  </body>
</html>

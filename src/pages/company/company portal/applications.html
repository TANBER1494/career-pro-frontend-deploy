    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
      body.loaded {
        opacity: 1;
      }
      body {
        opacity: 0; 
        transition: opacity 0.5s ease-in-out;
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }
      .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-right: 100px;
      }
      .magic-menu {
        display: flex;
        position: relative;
        gap: 15px; /* قللنا المسافة بين الايقونات شوية */
        align-items: center;
        padding: 0 10px;
      }
      .magic-menu li {
        position: relative;
        list-style: none;
        width: 42px; /* تصغير العرض (كان 50) */
        height: 42px; /* تصغير الطول (كان 50) */
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 60px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }
      /* ... (before & after كما هما) ... */
      .magic-menu li::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        opacity: 0;
        transition: 0.5s;
      }
      .magic-menu li::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        transition: 0.5s;
        filter: blur(15px);
        z-index: -1;
        opacity: 0;
      }

      /* Hover State */
      .magic-menu li:hover,
      .magic-menu li.active {
        width: 130px; /* تصغير عرض التمدد قليلاً */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
      }
      .magic-menu li:hover::before,
      .magic-menu li.active::before {
        opacity: 1;
      }
      .magic-menu li:hover::after,
      .magic-menu li.active::after {
        opacity: 0.5;
      }

      .magic-menu li ion-icon {
        color: #777;
        font-size: 1.3em; /* تصغير حجم الايقونة لتناسب الدائرة الجديدة */
        transition: 0.5s;
        transition-delay: 0.25s;
      }
      /* ... باقي الستايل كما هو ... */
      .magic-menu li:hover ion-icon,
      .magic-menu li.active ion-icon {
        transform: scale(0);
        color: #fff;
        transition-delay: 0s;
      }
      .magic-menu li span.title {
        position: absolute;
        color: #fff;
        font-size: 0.85em; /* تصغير الخط قليلاً */
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transform: scale(0);
        transition: 0.5s;
        transition-delay: 0s;
      }
      .magic-menu li:hover span.title,
      .magic-menu li.active span.title {
        transform: scale(1);
        transition-delay: 0.25s;
      }
    </style>
  </head>
  <body class=" text-gray-800">

    >

    class="flex items-center gap-3 w-auto text-2xl font-semibold cursor-pointer onclick="window.scrollTo({top: 0, behavior: 'smooth'})"

    </a>

      <div class="hidden md:flex flex-1 nav-container">
        <div
          class="bg-gray-50 px-6 py-2 rounded-full border border-gray-200 shadow-inner"
        >
        <ul class="magic-menu">

          <li class="menu-item" data-url="profile.html" style="--i: #67e3ff;--j:#69a8b8">

          </li>
      
          <li class="menu-item active" data-url="applications.html" style="--i: #72f3f3;--j:#29a8a8">

        </div>
      </div>

        id="btnLogout"
  class="group flex items-center justify-start w-11 h-11 bg-red-600 rounded-full cursor-pointer relative overflow-hidden transition-all duration-500 shadow-lg hover:w-32 hover:rounded-3xl active:translate-x-1 active:translate-y-1"
>

  >
    <svg class="w-4 h-4" viewBox="0 0 512 512" fill="white">
      <path
        d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"
      ></path>
    </svg>
  </div>

</button>

      </div>

    <main class="w-full mx-auto p-6 space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">
            Applications Management
          </h1>
          <p class="text-gray-500 mt-1">Review and manage job applications</p>
        </div>
        <a
          href="jobs.html"
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-sm"
        >
          <i class="fas fa-briefcase"></i> View Jobs
        </a>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
        <div class="w-full">
          <div class="relative flex-grow w-full md:w-auto ">
            <input
            type="text"
            id="searchInput"
            placeholder="Search jobs..."
            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:border-blue-500 outline-none transition-all duration-300 peer"
            />
            <i class="fas fa-search absolute left-4 top-1/2  -translate-y-1/2 text-gray-400 peer-focus:text-blue-500 peer-focus:scale-125 transition-all duration-300 pointer-events-none"></i>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-cyan-600" id="stat-total">--</h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">Total</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-blue-600" id="stat-new">--</h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">New</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-yellow-500" id="stat-reviewing">
            --
          </h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">
            Reviewing
          </p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-purple-600" id="stat-interviewed">
            --
          </h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">
            Interviewed
          </p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-green-600" id="stat-hired">--</h3>
          <p class="text-xs text-gray-500 uppercase font-bold mt-1">Hired</p>
        </div>
      </div>

      <div id="applicationsContainer" class="space-y-4">
        <div class="text-center py-12 text-gray-500">
          <i class="fas fa-spinner fa-spin text-3xl mb-3 text-blue-600"></i>
          <p>Loading applications...</p>
        </div>
      </div>

      <div
        class="flex items-center justify-between pt-4 border-t border-gray-200"
      >
        <button
          id="prevPage"
          class="px-4 py-2 rounded-lg text-white bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-sm font-medium transition"
        >
          <i class="fas fa-chevron-left mr-1"></i> Previous
        </button>
        <span id="pageInfo" class="text-sm text-gray-600">Page 1</span>
        <button
          id="nextPage"
          class="px-4 py-2 rounded-lg text-white bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-sm font-medium transition"
        >
          Next <i class="fas fa-chevron-right ml-1"></i>
        </button>
      </div>
    </main>
    <script>
      window.addEventListener('load', function() {
      document.body.classList.add('loaded');
      });
      const menuItems = document.querySelectorAll('.menu-item');
      menuItems.forEach(item => {
      item.addEventListener('click', function() {
      document.body.classList.remove('loaded');
      const targetPage = this.getAttribute('data-url');
      setTimeout(() => {
      window.location.href = targetPage;
        }, 400);
    });
});

    </script>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Job - CareerPro</title>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet"type="text/css"href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>
    <script type="module"src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="website icon" type="png" href="../../../../assets/imgs/Logo.png"/>
    <style>
      body {
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }

      .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-right: 100px;
      }
      .magic-menu {
        display: flex;
        position: relative;
        gap: 15px; /* قللنا المسافة بين الايقونات شوية */
        align-items: center;
        padding: 0 10px;
      }
      .magic-menu li {
        position: relative;
        list-style: none;
        width: 42px; /* تصغير العرض (كان 50) */
        height: 42px; /* تصغير الطول (كان 50) */
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 60px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }
      /* ... (before & after كما هما) ... */
      .magic-menu li::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        opacity: 0;
        transition: 0.5s;
      }
      .magic-menu li::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        transition: 0.5s;
        filter: blur(15px);
        z-index: -1;
        opacity: 0;
      }

      /* Hover State */
      .magic-menu li:hover,
      .magic-menu li.active {
        width: 130px; /* تصغير عرض التمدد قليلاً */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
      }
      .magic-menu li:hover::before,
      .magic-menu li.active::before {
        opacity: 1;
      }
      .magic-menu li:hover::after,
      .magic-menu li.active::after {
        opacity: 0.5;
      }

      .magic-menu li ion-icon {
        color: #777;
        font-size: 1.3em; /* تصغير حجم الايقونة لتناسب الدائرة الجديدة */
        transition: 0.5s;
        transition-delay: 0.25s;
      }
      /* ... باقي الستايل كما هو ... */
      .magic-menu li:hover ion-icon,
      .magic-menu li.active ion-icon {
        transform: scale(0);
        color: #fff;
        transition-delay: 0s;
      }
      .magic-menu li span.title {
        position: absolute;
        color: #fff;
        font-size: 0.85em; /* تصغير الخط قليلاً */
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transform: scale(0);
        transition: 0.5s;
        transition-delay: 0s;
      }
      .magic-menu li:hover span.title,
      .magic-menu li.active span.title {
        transform: scale(1);
        transition-delay: 0.25s;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <nav
      class="sticky top-0 z-50 bg-white/80 border-b border-gray-200 backdrop-blur-md px-6 py-4 flex items-center justify-between"
    >
    <a
    href="dashboard.html"
    class="text-2xl font-semibold text-blue-500 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
  >
  <i class="fas fa-building"></i> 
  <span>Company Portal</span>
  </a>
    </nav>

    <main class="w-full mx-auto p-6 space-y-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a
          href="jobs.html"
          class="flex w-fit items-center text-slate-500 hover:text-blue-600 transition-colors mt-6 ml-6 mb-10 group"
        >
          <i
            class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"
          ></i>
          <span class="text-sm font-medium">Back</span>
        </a>
          <div>
            <h1 id="pageTitle" class="text-3xl font-bold text-gray-900">
              Edit Job
            </h1>
            <p id="pageSubtitle" class="text-gray-500 mt-1">
              Update your job posting details
            </p>
          </div>
        </div>
        <div class="flex gap-3">
          <button
            id="btnPreview"
            class="bg-white border border-gray-700 text-gray-700 hover:bg-gray-700 hover:text-white  px-4 py-2 rounded-lg font-medium transition flex items-center gap-2"
          >
            <i class="fas fa-eye"></i> <span>Preview</span>
          </button>

          <button
            id="btnSaveChanges"
            class="bg-blue-600 hover:bg-blue-700 text-white  px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-sm"
          >
            <i class="fas fa-save"></i> Save Changes
          </button>
        </div>
      </div>

      <div id="loadingState" class="hidden text-center py-20">
        <i class="fas fa-spinner fa-spin text-4xl text-blue-600"></i>
        <p class="mt-4 text-gray-500">Loading job details...</p>
      </div>

      <form id="jobForm" class="space-y-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">
            Basic Information
          </h3>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="col-span-2 md:col-span-1">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Job Title *</label
              >
              <input
                type="text"
                id="title"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                required
              />
            </div>
            <div class="col-span-2 md:col-span-1">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Department</label
              >
              <input
                type="text"
                id="department"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Location *</label
              >
              <input
                type="text"
                id="location"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                required
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Employment Type *</label
              >
              <select
                id="type"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition"
              >
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
                <option value="Internship">Internship</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Experience Level *</label
              >
              <select
                id="experienceLevel"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white transition"
              >
                <option value="Entry-level">Entry-level</option>
                <option value="Mid-level">Mid-level</option>
                <option value="Senior-level">Senior-level</option>
                <option value="Executive">Executive</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Minimum Salary ($)</label
              >
              <input
                type="number"
                id="salaryMin"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Maximum Salary ($)</label
              >
              <input
                type="number"
                id="salaryMax"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              />
            </div>
          </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
          <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">
            Job Details
          </h3>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Job Description *</label
              >
              <textarea
                id="description"
                rows="5"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                required
              ></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Requirements</label
              >
              <textarea
                id="requirements"
                rows="4"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              ></textarea>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Required Skills (Comma separated) *</label
              >
              <input
                type="text"
                id="skills"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                required
              />
              <p class="text-xs text-gray-500 mt-1">
                These will be used for AI matching.
              </p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Years of Experience</label
                >
                <input
                  type="text"
                  id="yearsOfExperience"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1"
                  >Education</label
                >
                <input
                  type="text"
                  id="education"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >Benefits & Perks</label
              >
              <textarea
                id="benefits"
                rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              ></textarea>
            </div>
          </div>
        </div>
      </form>

      <div
        id="previewMode"
        class="hidden bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-8"
      >
        <div class="border-b border-gray-200 pb-6">
          <h2 id="prev-title" class="text-3xl font-bold text-gray-900 mb-4">
            Job Title
          </h2>
          <div class="flex flex-wrap gap-4 text-gray-600">
            <span class="flex items-center gap-1"
              ><i class="fas fa-map-marker-alt"></i>
              <span id="prev-location">Location</span></span
            >
            <span class="flex items-center gap-1"
              ><i class="fas fa-briefcase"></i>
              <span id="prev-type">Type</span></span
            >
            <span class="flex items-center gap-1"
              ><i class="fas fa-layer-group"></i>
              <span id="prev-level">Level</span></span
            >
          </div>
          <div
            id="prev-salary"
            class="mt-3 font-semibold text-blue-600 text-lg"
          >
            $0 - $0
          </div>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Job Description</h3>
          <p
            id="prev-description"
            class="text-gray-700 whitespace-pre-wrap leading-relaxed"
          >
            ...
          </p>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Requirements</h3>
          <p
            id="prev-requirements"
            class="text-gray-700 whitespace-pre-wrap leading-relaxed"
          >
            ...
          </p>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Required Skills</h3>
          <div id="prev-skills" class="flex flex-wrap gap-2"></div>
        </div>

        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 p-4 rounded-lg"
        >
          <div>
            <span class="text-sm text-gray-500 font-bold uppercase"
              >Experience</span
            >
            <p id="prev-experience" class="text-gray-900 font-medium">--</p>
          </div>
          <div>
            <span class="text-sm text-gray-500 font-bold uppercase"
              >Education</span
            >
            <p id="prev-education" class="text-gray-900 font-medium">--</p>
          </div>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Benefits</h3>
          <p id="prev-benefits" class="text-gray-700 whitespace-pre-wrap">
            ...
          </p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script
      type="module"
      src="/src/js/services/jobManagementService.js"
    ></script>
    <script type="module" src="/src/js/services/jobService.js"></script>
    <script
      type="module"
      src="/src/js/controllers/editJobController.js"
    ></script>
  </body>
</html>

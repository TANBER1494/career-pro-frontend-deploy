<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Job - Company Portal</title>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet"type="text/css"href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>
    <script type="module"src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="/src/css/main.css" rel="stylesheet">
    <script type="module" src="/src/js/controllers/DarkModeController.js"></script>
    <link rel="website icon" type="png" href="../../../../assets/imgs/Logo.png"/>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
      body {
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }
      .dark body {
        transition: opacity 0.5s ease-in-out;
        background: #110b36;
        background: linear-gradient(131deg,rgba(17, 11, 54, 1) 0%, rgba(38, 42, 102, 1) 35%, rgba(55, 31, 89, 1) 100%);
      }
      .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-right: 100px;
      }

.toggleSwitch {
  width: 56px;
  height: 56px;
  display: grid;
  border-radius: 50%;
  position: relative;
  place-items: center;
  cursor: pointer;
  transition: transform 0.2s ease;
  line-height: 1;
  overflow: hidden;
  margin-left: 2%;
}

#checkboxInput {
  display: none;
}

.icons {
  grid-column: 1 / 1;
  grid-row: 1 / 1;
  width: 80%;
  height: 80%;
  display: grid;
  place-items: center;
  z-index: 2;
  transform-origin: center center;
  transition:
    transform 500ms ease,
    opacity 300ms ease;
  opacity: 0;
  pointer-events: none;
}

.icons--moon {
  color: #212121;
  /* background-color: #e8e8e8; */
  border-radius: 50%;
}
.icons--sun {
  color: #ffa600;
  /* background-color: #e8e8e8; */
  border-radius: 50%;
}
.dark .icons--sun {
  color: #ffa600;
  filter: drop-shadow(0 0 5px #ffa600) drop-shadow(0 0 6px rgba(255, 166, 0, 0.6));
}
.icons--moon,
.icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--sun {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--moon {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:checked + .toggleSwitch .icons--moon {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:checked + .toggleSwitch .icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:active + .toggleSwitch {
  transform: scale(0.94);
}
.icons svg {
  fill: currentColor !important;
}
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <nav
    class="sticky top-0 z-50 bg-white/80 dark:bg-black/30 backdrop-blur-md px-6 py-3 flex items-center justify-between shadow-sm mb-8"
    >
    <a
    href="/Company_dashboard"
    class="flex items-center gap-3 w-auto text-2xl font-semibold cursor-pointer"
    onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
  >
    <img
      src="../../../../assets/imgs/Logo.png"
      alt="CareerGuidance Logo"
      class="h-12 w-auto object-contain"
    />
    <span class="font-lexend font-simibold not-italic dark:text-slate-100">
      Company Portal
    </span>
  </a>
  <input id="checkboxInput" type="checkbox" />
      <label class="toggleSwitch" for="checkboxInput">
        <div class="icons icons--moon">
          <svg
            class="moon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            width="32"
            height="32"
          >
            <path
              fill-rule="evenodd"
              d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </div>
      
        <div class="icons icons--sun">
          <svg
            class="sun"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            width="32"
            height="32"
          >
            <path
              d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"
            ></path>
          </svg>
        </div>
      </label>
    </nav>

    <main class="w-full mx-auto p-6 space-y-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a
            href="/Company_jobs"
            class="flex w-fit items-center text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-slate-200 transition-colors mt-6 ml-6 mb-10 group"
          >
            <i
              class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"
            ></i>
    
            <span class="text-sm font-medium">Back</span>
          </a>
    
          <div>
            <h1
              id="pageTitle"
              class="text-3xl font-bold text-gray-900 dark:text-slate-100"
            >
              Edit Job
            </h1>
    
            <p
              id="pageSubtitle"
              class="text-gray-500 dark:text-slate-400 mt-1"
            >
              Update your job posting details
            </p>
          </div>
        </div>
    
      </div>
      <div class="flex flex-wrap sm:flex-nowrap gap-2">
        <button
          id="btnPreview"
          class="sm:w-auto bg-white dark:bg-black/30 border border-gray-700 dark:border-slate-400 dark:hover:border-slate-200 dark:hover:text-slate-200 text-gray-700 dark:text-slate-400 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2"
        >
          <i class="fas fa-eye"></i>
          <span>Preview</span>
        </button>
  
        <button
          id="btnSaveChanges"
          class="sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-sm"
        >
          <i class="fas fa-save"></i>
          Save Changes
        </button>
      </div>
    
      <div id="loadingState" class="hidden text-center py-20">
        <i
          class="fas fa-spinner fa-spin text-4xl text-blue-600 dark:text-blue-400"
        ></i>
    
        <p class="mt-4 text-gray-500 dark:text-slate-400">
          Loading job details...
        </p>
      </div>
    
      <form id="jobForm" class="space-y-6">
        <div
          class="bg-white dark:bg-black/30 rounded-xl shadow-sm border border-gray-200 dark:border-slate-800 p-6"
        >
          <h3
            class="text-lg font-bold text-gray-900 dark:text-slate-100 mb-4 border-b border-gray-200 dark:border-slate-800 pb-2"
          >
            Basic Information
          </h3>
    
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div class="col-span-2 md:col-span-1">
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Job Title *
              </label>
    
              <input
                type="text"
                id="title"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
                required
              />
            </div>
    
            <div class="col-span-2 md:col-span-1">
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Department
              </label>
    
              <input
                type="text"
                id="department"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
              />
            </div>
          </div>
    
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Location *
              </label>
    
              <input
                type="text"
                id="location"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
                required
              />
            </div>
    
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Employment Type *
              </label>
    
              <select
                id="type"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
              >
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
                <option value="Internship">Internship</option>
              </select>
            </div>
    
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Experience Level *
              </label>
    
              <select
                id="experienceLevel"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
              >
                <option value="Entry-level">Entry-level</option>
                <option value="Mid-level">Mid-level</option>
                <option value="Senior-level">Senior-level</option>
                <option value="Executive">Executive</option>
              </select>
            </div>
          </div>
    
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Minimum Salary ($)
              </label>
    
              <input
                type="number"
                id="salaryMin"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
              />
            </div>
    
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Maximum Salary ($)
              </label>
    
              <input
                type="number"
                id="salaryMax"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
              />
            </div>
          </div>
        </div>
    
        <div
          class="bg-white dark:bg-black/30 rounded-xl shadow-sm border border-gray-200 dark:border-slate-800 p-6"
        >
          <h3
            class="text-lg font-bold text-gray-900 dark:text-slate-100 mb-4 border-b border-gray-200 dark:border-slate-800 pb-2"
          >
            Job Details
          </h3>
    
          <div class="space-y-4">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Job Description *
              </label>
    
              <textarea
                id="description"
                rows="5"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
                required
              ></textarea>
            </div>
    
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Requirements
              </label>
    
              <textarea
                id="requirements"
                rows="4"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
              ></textarea>
            </div>
    
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Required Skills (Comma separated) *
              </label>
    
              <input
                type="text"
                id="skills"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
                required
              />
    
              <p class="text-xs text-gray-500 dark:text-slate-400 mt-1">
                These will be used for AI matching.
              </p>
            </div>
    
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
                >
                  Years of Experience
                </label>
    
                <input
                  type="text"
                  id="yearsOfExperience"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
                />
              </div>
    
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
                >
                  Education
                </label>
    
                <input
                  type="text"
                  id="education"
                  class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
                />
              </div>
            </div>
    
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1"
              >
                Benefits & Perks
              </label>
    
              <textarea
                id="benefits"
                rows="3"
                class="w-full px-3 py-2 border border-gray-300 dark:border-slate-700 rounded-lg bg-white dark:bg-black/30 text-gray-900 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:focus:border-slate-200 dark:focus:ring-white/50 outline-none transition"
              ></textarea>
            </div>
          </div>
        </div>
      </form>
    
      <div
        id="previewMode"
        class="hidden bg-white dark:bg-black/30 rounded-xl shadow-sm border border-gray-200 dark:border-slate-800 p-8 space-y-8"
      >
        <div class="border-b border-gray-200 dark:border-slate-800 pb-6">
          <h2
            id="prev-title"
            class="text-3xl font-bold text-gray-900 dark:text-slate-100 mb-4"
          >
            Job Title
          </h2>
    
          <div class="flex flex-wrap gap-4 text-gray-600 dark:text-slate-400">
            <span class="flex items-center gap-1">
              <i class="fas fa-map-marker-alt"></i>
              <span id="prev-location">Location</span>
            </span>
    
            <span class="flex items-center gap-1">
              <i class="fas fa-briefcase"></i>
              <span id="prev-type">Type</span>
            </span>
    
            <span class="flex items-center gap-1">
              <i class="fas fa-layer-group"></i>
              <span id="prev-level">Level</span>
            </span>
          </div>
    
          <div
            id="prev-salary"
            class="mt-3 font-semibold text-blue-600 dark:text-blue-400 text-lg"
          >
            $0 - $0
          </div>
        </div>
    
        <div>
          <h3
            class="text-xl font-bold text-gray-900 dark:text-slate-100 mb-3"
          >
            Job Description
          </h3>
    
          <p
            id="prev-description"
            class="text-gray-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed"
          >
            ...
          </p>
        </div>
    
        <div>
          <h3
            class="text-xl font-bold text-gray-900 dark:text-slate-100 mb-3"
          >
            Requirements
          </h3>
    
          <p
            id="prev-requirements"
            class="text-gray-700 dark:text-slate-300 whitespace-pre-wrap leading-relaxed"
          >
            ...
          </p>
        </div>
    
        <div>
          <h3
            class="text-xl font-bold text-gray-900 dark:text-slate-100 mb-3"
          >
            Required Skills
          </h3>
    
          <div id="prev-skills" class="flex flex-wrap gap-2"></div>
        </div>
    
        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-50 dark:bg-black/30 p-4 rounded-lg"
        >
          <div>
            <span
              class="text-sm text-gray-500 dark:text-slate-400 font-bold uppercase"
            >
              Experience
            </span>
    
            <p
              id="prev-experience"
              class="text-gray-900 dark:text-slate-100 font-medium"
            >
              --
            </p>
          </div>
    
          <div>
            <span
              class="text-sm text-gray-500 dark:text-slate-400 font-bold uppercase"
            >
              Education
            </span>
    
            <p
              id="prev-education"
              class="text-gray-900 dark:text-slate-100 font-medium"
            >
              --
            </p>
          </div>
        </div>
    
        <div>
          <h3
            class="text-xl font-bold text-gray-900 dark:text-slate-100 mb-3"
          >
            Benefits
          </h3>
    
          <p
            id="prev-benefits"
            class="text-gray-700 dark:text-slate-300 whitespace-pre-wrap"
          >
            ...
          </p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script
      type="module"
      src="/src/js/services/jobManagementService.js"
    ></script>
    <script type="module" src="/src/js/services/jobService.js"></script>
    <script
      type="module"
      src="/src/js/controllers/editJobController.js"
    ></script>
  </body>
</html>

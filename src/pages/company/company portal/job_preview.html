<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Preview - Company Portal</title>
    <script type="module"src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet"type="text/css"href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>
    <link rel="website icon" type="png" href="../../../../assets/imgs/Logo.png"/>
  <style>
    body {
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }

      .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-right: 100px;
      }
      .magic-menu {
        display: flex;
        position: relative;
        gap: 15px; /* قللنا المسافة بين الايقونات شوية */
        align-items: center;
        padding: 0 10px;
      }
      .magic-menu li {
        position: relative;
        list-style: none;
        width: 42px; /* تصغير العرض (كان 50) */
        height: 42px; /* تصغير الطول (كان 50) */
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 60px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }
      /* ... (before & after كما هما) ... */
      .magic-menu li::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        opacity: 0;
        transition: 0.5s;
      }
      .magic-menu li::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        transition: 0.5s;
        filter: blur(15px);
        z-index: -1;
        opacity: 0;
      }

      /* Hover State */
      .magic-menu li:hover,
      .magic-menu li.active {
        width: 130px; /* تصغير عرض التمدد قليلاً */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
      }
      .magic-menu li:hover::before,
      .magic-menu li.active::before {
        opacity: 1;
      }
      .magic-menu li:hover::after,
      .magic-menu li.active::after {
        opacity: 0.5;
      }

      .magic-menu li ion-icon {
        color: #777;
        font-size: 1.3em; /* تصغير حجم الايقونة لتناسب الدائرة الجديدة */
        transition: 0.5s;
        transition-delay: 0.25s;
      }
      /* ... باقي الستايل كما هو ... */
      .magic-menu li:hover ion-icon,
      .magic-menu li.active ion-icon {
        transform: scale(0);
        color: #fff;
        transition-delay: 0s;
      }
      .magic-menu li span.title {
        position: absolute;
        color: #fff;
        font-size: 0.85em; /* تصغير الخط قليلاً */
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transform: scale(0);
        transition: 0.5s;
        transition-delay: 0s;
      }
      .magic-menu li:hover span.title,
      .magic-menu li.active span.title {
        transform: scale(1);
        transition-delay: 0.25s;
      }
  </style>
  </head>
  <body class="bg-gray-50 font-sans text-gray-800">
    <nav
      class="sticky top-0 z-50 bg-white/80 border-b border-gray-200 backdrop-blur-md px-6 py-4 flex items-center justify-between"
    >
    <a
    href="dashboard.html"
    class="text-2xl font-semibold text-blue-500 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
  >
  <i class="fas fa-building"></i> 
  <span>Company Portal</span>
  </a>
    </nav>

    <main class="w-full mx-auto p-6 space-y-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a
          href="jobs.html"
          class="flex w-fit items-center text-slate-500 hover:text-blue-600 transition-colors mt-6 ml-6 mb-10 group"
        >
          <i
            class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"
          ></i>
          <span class="text-sm font-medium">Back</span>
        </a>
          <div>
            <h1 class="text-3xl font-bold text-gray-900">Job Preview</h1>
            <p class="text-gray-500 mt-1">
              Review your job posting before publishing
            </p>
          </div>
        </div>
        <div class="flex gap-3">
          <button
            id="btnEdit"
            class="bg-white border border-gray-700 text-gray-700 hover:bg-gray-700 hover:text-white  px-4 py-2 rounded-lg font-medium transition flex items-center gap-2"
          >
            <i class="fas fa-edit"></i> Edit
          </button>
          <button
            id="btnSaveDraft"
            class="bg-white border border-violet-600 text-violet-600 hover:bg-violet-600 hover:text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2"
          >
            <i class="fas fa-save"></i> Save Draft
          </button>
          <button
            id="btnPublish"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-sm"
          >
            Publish Job
          </button>
        </div>
      </div>

      <div
        class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 space-y-8"
      >
        <div class="border-b border-gray-200 pb-6">
          <h2 id="preview-title" class="text-3xl font-bold text-gray-900 mb-4">
            Job Title
          </h2>
          <div class="flex flex-wrap gap-4 text-gray-600">
            <span id="preview-company" class="font-medium text-gray-900"
              >Company Name</span
            >
            <span>•</span>
            <span id="preview-location">Location</span>
            <span>•</span>
            <span id="preview-type">Type</span>
            <span>•</span>
            <span id="preview-level">Level</span>
          </div>
          <div class="mt-3 text-blue-600 font-semibold text-lg">
            <span id="preview-salary">$0 - $0</span>
          </div>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Job Description</h3>
          <p
            id="preview-description"
            class="text-gray-700 leading-relaxed whitespace-pre-wrap"
          ></p>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Requirements</h3>
          <p
            id="preview-requirements"
            class="text-gray-700 leading-relaxed whitespace-pre-wrap"
          ></p>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Required Skills</h3>
          <div id="preview-skills" class="flex flex-wrap gap-2"></div>
        </div>

        <div>
          <h3 class="text-xl font-bold text-gray-900 mb-3">Benefits</h3>
          <p
            id="preview-benefits"
            class="text-gray-700 leading-relaxed whitespace-pre-wrap"
          ></p>
        </div>

        <div
          class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-6 border-t border-gray-100"
        >
          <div>
            <span class="text-sm text-gray-500 block mb-1"
              >Experience Required</span
            >
            <span id="preview-experience" class="text-gray-900 font-medium"
              >--</span
            >
          </div>
          <div>
            <span class="text-sm text-gray-500 block mb-1">Education</span>
            <span id="preview-education" class="text-gray-900 font-medium"
              >--</span
            >
          </div>
        </div>
      </div>
    </main>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script
      type="module"
      src="/src/js/services/jobManagementService.js"
    ></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Management - CareerPro</title>
    <script type="module"src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet"type="text/css"href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>
    <style>
      body {
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }

      .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-right: 100px;
      }
      .magic-menu {
        display: flex;
        position: relative;
        gap: 15px; /* قللنا المسافة بين الايقونات شوية */
        align-items: center;
        padding: 0 10px;
      }
      .magic-menu li {
        position: relative;
        list-style: none;
        width: 42px; /* تصغير العرض (كان 50) */
        height: 42px; /* تصغير الطول (كان 50) */
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 60px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }
      /* ... (before & after كما هما) ... */
      .magic-menu li::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        opacity: 0;
        transition: 0.5s;
      }
      .magic-menu li::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        transition: 0.5s;
        filter: blur(15px);
        z-index: -1;
        opacity: 0;
      }

      /* Hover State */
      .magic-menu li:hover,
      .magic-menu li.active {
        width: 130px; /* تصغير عرض التمدد قليلاً */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
      }
      .magic-menu li:hover::before,
      .magic-menu li.active::before {
        opacity: 1;
      }
      .magic-menu li:hover::after,
      .magic-menu li.active::after {
        opacity: 0.5;
      }

      .magic-menu li ion-icon {
        color: #777;
        font-size: 1.3em; /* تصغير حجم الايقونة لتناسب الدائرة الجديدة */
        transition: 0.5s;
        transition-delay: 0.25s;
      }
      /* ... باقي الستايل كما هو ... */
      .magic-menu li:hover ion-icon,
      .magic-menu li.active ion-icon {
        transform: scale(0);
        color: #fff;
        transition-delay: 0s;
      }
      .magic-menu li span.title {
        position: absolute;
        color: #fff;
        font-size: 0.85em; /* تصغير الخط قليلاً */
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transform: scale(0);
        transition: 0.5s;
        transition-delay: 0s;
      }
      .magic-menu li:hover span.title,
      .magic-menu li.active span.title {
        transform: scale(1);
        transition-delay: 0.25s;
      }
    </style>
  </head>
  <body class=" text-gray-800 w-full">
    <nav
    class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm mb-8"
    >
      <a
        href="dashboard.html"
        class="text-2xl font-semibold text-blue-500 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
      >
      <i class="fas fa-building"></i> 
      <span>Company Portal</span>
      </a>

      <div class="hidden md:flex flex-1 nav-container">
        <div
          class="bg-gray-50 px-6 py-2 rounded-full border border-gray-200 shadow-inner"
        >
          <ul class="magic-menu">
            <li
            style="--i: #5eb6fd;--j:#0576d3"
            onclick="window.location.href='dashboard.html'">
            <span class="icon"><ion-icon name="easel-outline"></ion-icon></span>
            <span class="title">dashboard</span>
          </li>
          <li
          style="--i: #67e3ff;--j:#69a8b8"
          onclick="window.location.href='profile.html'">
          <span class="icon"><ion-icon name="person-outline"></ion-icon></span>
          <span class="title">profile</span>
        </li>
          <li
          class="active"
            style="--i: #8f68d6;--j:#4e3085"
            onclick="window.location.href='jobs.html'">
            <span class="icon"><ion-icon name="bag-outline"></ion-icon></span>
            <span class="title">Jobs</span>
          </li>
          <li
            style="--i: #72f3f3;--j:#29a8a8"
            onclick="window.location.href='applications.html'">
            <span class="icon"><ion-icon name="documents-outline"></ion-icon></span>
            <span class="title">Applications</span>
          </li>
          <li
            style="--i: #2cc034;--j:#17741b"
            onclick="window.location.href='verification.html'">
            <span class="icon"><ion-icon name="shield-outline"></ion-icon></span>
            <span class="title">Verification</span>
          </li>
            </ul>
        </div>
      </div>
      <div>
        <button
          id="btnLogout"
          class="text-gray-600 hover:text-red-600 font-bold flex items-center gap-2 transition duration-300"
        >
          <i class="fas fa-sign-out-alt"></i> Log out
        </button>
      </div>
    </nav>

    <main class="w-full mx-auto p-6 space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Job Management</h1>
          <p class="text-gray-500 mt-1">
            Manage your job postings and applications
          </p>
        </div>
        <a
          href="post_job.html"
          class="bg-blue-600 hover:bg-blue-700 text-white  px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-sm"
        >
          <i class="fas fa-plus"></i> Post New Job
        </a>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
        <div
          class="flex flex-col md:flex-row gap-4 items-center justify-between"
        >
        <div class="relative flex-grow w-full md:w-auto ">
          <input
          type="text"
          id="search-input"
          placeholder="Search jobs..."
          class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:border-blue-500 outline-none transition-all duration-300 peer"
          />
          <i class="fas fa-search absolute left-4 top-1/2  -translate-y-1/2 text-gray-400 peer-focus:text-blue-500 peer-focus:scale-125 transition-all duration-300 pointer-events-none"></i>
        </div>
          <div class="flex items-center gap-2 w-full md:w-auto">
            <span class="text-sm text-gray-500 font-medium"
              >Filter by status:</span
            >
            <select
              id="statusFilter"
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white"
            >
              <option value="all">All Status</option>
              <option value="published">Active</option>
              <option value="draft">Draft</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-blue-700" id="stat-active">--</h3>
          <p class="text-sm text-gray-500">Active Jobs</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-violet-700" id="stat-draft">--</h3>
          <p class="text-sm text-gray-500">Draft Jobs</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-cyan-500" id="stat-apps">--</h3>
          <p class="text-sm text-gray-500">Total Applications</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-blue-600" id="stat-views">--</h3>
          <p class="text-sm text-gray-500">Total Views</p>
        </div>
      </div>

      <div id="jobsContainer" class="space-y-4">
        <div class="text-center py-10 text-gray-500">
          <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
          <p>Loading jobs...</p>
        </div>
      </div>
    </main>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script
      type="module"
      src="/src/js/services/jobManagementService.js"
    ></script>

    <script
      type="module"
      src="/src/js/controllers/jobsListController.js"
    ></script>
  </body>
</html>

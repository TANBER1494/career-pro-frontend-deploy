<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Management - CareerPro</title>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
  </head>
  <body class="bg-gray-50 font-sans text-gray-800">
    <nav
      class="sticky top-0 z-50 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between"
    >
      <div class="flex items-center space-x-8">
        <a
          href="dashboard.html"
          class="text-xl font-bold text-cyan-600 flex items-center gap-2"
        >
          <i class="fas fa-building"></i> <span>Company Portal</span>
        </a>
        <div
          class="hidden md:flex items-center space-x-6 text-gray-600 font-medium"
        >
          <a href="dashboard.html" class="hover:text-cyan-600">Dashboard</a>
          <a href="profile.html" class="hover:text-cyan-600">Profile</a>
          <a
            href="jobs.html"
            class="text-cyan-600 border-b-2 border-cyan-600 pb-1"
            >Jobs</a
          >
          <a href="applications.html" class="hover:text-cyan-600"
            >Applications</a
          >
          <a href="verification.html" class="hover:text-cyan-600"
            >Verification</a
          >
        </div>
      </div>
      <div>
        <button
          id="btnLogout"
          class="text-gray-600 hover:text-red-600 font-medium flex items-center gap-2"
        >
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Job Management</h1>
          <p class="text-gray-500 mt-1">
            Manage your job postings and applications
          </p>
        </div>
        <a
          href="post_job.html"
          class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded-lg font-medium transition flex items-center gap-2 shadow-sm"
        >
          <i class="fas fa-plus"></i> Post New Job
        </a>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
        <div
          class="flex flex-col md:flex-row gap-4 items-center justify-between"
        >
          <div class="relative flex-1 w-full">
            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Search jobs..."
              class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 outline-none transition"
            />
          </div>
          <div class="flex items-center gap-2 w-full md:w-auto">
            <span class="text-sm text-gray-500 font-medium"
              >Filter by status:</span
            >
            <select
              id="statusFilter"
              class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-cyan-500 outline-none bg-white"
            >
              <option value="all">All Status</option>
              <option value="published">Active</option>
              <option value="draft">Draft</option>
              <option value="closed">Closed</option>
            </select>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-cyan-600" id="stat-active">--</h3>
          <p class="text-sm text-gray-500">Active Jobs</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-yellow-500" id="stat-draft">--</h3>
          <p class="text-sm text-gray-500">Draft Jobs</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-green-600" id="stat-apps">--</h3>
          <p class="text-sm text-gray-500">Total Applications</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
          <h3 class="text-2xl font-bold text-blue-600" id="stat-views">--</h3>
          <p class="text-sm text-gray-500">Total Views</p>
        </div>
      </div>

      <div id="jobsContainer" class="space-y-4">
        <div class="text-center py-10 text-gray-500">
          <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
          <p>Loading jobs...</p>
        </div>
      </div>
    </main>

    <script
      type="text/javascript"
      src="https://cdn.jsdelivr.net/npm/toastify-js"
    ></script>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script
      type="module"
      src="/src/js/services/jobManagementService.js"
    ></script>

    <script
      type="module"
      src="/src/js/controllers/jobsListController.js"
    ></script>
  </body>
</html>

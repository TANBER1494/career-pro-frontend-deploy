<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post New Job - Company Portal</title>
    <script type="module"src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet"type="text/css"href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"/>
    <link rel="website icon" type="png" href="../../../../assets/imgs/Logo.png"/>
    <style>
      /* Badge Styles for Preview */
      @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
      .skill-badge {
        @apply px-3 py-1 rounded-full text-sm border bg-blue-50 text-blue-700 border-blue-200;
      }
      body {
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }

      .nav-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        margin-right: 100px;
      }
      .magic-menu {
        display: flex;
        position: relative;
        gap: 15px; /* قللنا المسافة بين الايقونات شوية */
        align-items: center;
        padding: 0 10px;
      }
      .magic-menu li {
        position: relative;
        list-style: none;
        width: 42px; /* تصغير العرض (كان 50) */
        height: 42px; /* تصغير الطول (كان 50) */
        background: white;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        border-radius: 60px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: 0.5s;
      }
      /* ... (before & after كما هما) ... */
      .magic-menu li::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        opacity: 0;
        transition: 0.5s;
      }
      .magic-menu li::after {
        content: "";
        position: absolute;
        top: 10px;
        width: 100%;
        height: 100%;
        border-radius: 60px;
        background: linear-gradient(45deg, var(--i), var(--j));
        transition: 0.5s;
        filter: blur(15px);
        z-index: -1;
        opacity: 0;
      }

      /* Hover State */
      .magic-menu li:hover,
      .magic-menu li.active {
        width: 130px; /* تصغير عرض التمدد قليلاً */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0);
      }
      .magic-menu li:hover::before,
      .magic-menu li.active::before {
        opacity: 1;
      }
      .magic-menu li:hover::after,
      .magic-menu li.active::after {
        opacity: 0.5;
      }

      .magic-menu li ion-icon {
        color: #777;
        font-size: 1.3em; /* تصغير حجم الايقونة لتناسب الدائرة الجديدة */
        transition: 0.5s;
        transition-delay: 0.25s;
      }
      /* ... باقي الستايل كما هو ... */
      .magic-menu li:hover ion-icon,
      .magic-menu li.active ion-icon {
        transform: scale(0);
        color: #fff;
        transition-delay: 0s;
      }
      .magic-menu li span.title {
        position: absolute;
        color: #fff;
        font-size: 0.85em; /* تصغير الخط قليلاً */
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        transform: scale(0);
        transition: 0.5s;
        transition-delay: 0s;
      }
      .magic-menu li:hover span.title,
      .magic-menu li.active span.title {
        transform: scale(1);
        transition-delay: 0.25s;
      }
    </style>
  </head>
  <body class="w-full bg-slate-50 text-gray-800 font-lexend">

  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 px-4 md:px-6 py-3 flex items-center justify-between shadow-sm">
    <a href="/Company_dashboard" class="flex items-center gap-3 w-auto text-xl md:text-2xl font-semibold cursor-pointer">
      <img src="../../../../assets/imgs/Logo.png" alt="CareerGuidance Logo" class="h-10 md:h-12 w-auto object-contain">
      <span class="hidden md:block font-semibold">Company Portal</span>
    </a>

    <div class="flex items-center">
      <button id="btnLogout" class="w-10 h-10 md:w-11 md:h-11 bg-red-600 text-white rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-all">
        <svg class="w-4 h-4" viewBox="0 0 512 512" fill="white">
          <path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path>
        </svg>
      </button>
    </div>
  </nav>

  <main class="w-full max-w-6xl mx-auto p-4 md:p-6 space-y-6">
    
    <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-6">
      <div class="space-y-3">
        <a href="/Company_jobs" class="flex items-center text-slate-500 hover:text-blue-600 transition-colors group">
          <i class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"></i>
          <span class="text-sm font-medium">Back</span>
        </a>
        <div>
          <h1 id="pageTitle" class="text-2xl md:text-3xl font-bold text-gray-900 leading-tight">Create New Job</h1>
          <p id="pageSubtitle" class="text-gray-500 mt-1 text-sm md:text-base">Fill in the details for your job posting</p>
        </div>
      </div>

      <div class="flex flex-wrap sm:flex-nowrap gap-2">
        <button id="btnPreview" class="flex-1 sm:w-auto px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg font-medium text-sm flex items-center justify-center gap-2">
          <i class="fas fa-eye"></i> Preview
        </button>
        <button id="btnSaveDraft" class="flex-1 sm:w-auto px-4 py-2 bg-white border border-violet-600 text-violet-600 rounded-lg font-medium text-sm flex items-center justify-center gap-2">
          <i class="fas fa-save"></i> Save Draft
        </button>
        <button id="btnPublish" class="w-full sm:w-auto px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm shadow-md flex items-center justify-center gap-2 transition-all">
          <i class="fas fa-rocket"></i> Publish Job
        </button>
      </div>
    </div>

    <form id="jobForm" class="space-y-6">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
        <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Basic Information</h3>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Job Title *</label>
            <input type="text" id="title" placeholder="e.g. Senior Frontend" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" required>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Department</label>
            <input type="text" id="department" placeholder="e.g. Engineering" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
          </div>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:col-span-2">
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">Location *</label>
              <input type="text" id="location" placeholder="Remote / City" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none" required>
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">Employment Type *</label>
              <select id="type" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white outline-none">
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
              </select>
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">Experience Level *</label>
              <select id="experienceLevel" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white outline-none">
                <option value="Senior-level">Senior-level</option>
                <option value="Mid-level">Mid-level</option>
              </select>
            </div>
          </div>

          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Minimum Salary ($)</label>
            <input type="number" id="salaryMin" placeholder="e.g. 80000" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none">
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Maximum Salary ($)</label>
            <input type="number" id="salaryMax" placeholder="e.g. 120000" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none">
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
        <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">Job Details</h3>
        <div class="space-y-4">
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Job Description *</label>
            <textarea id="description" rows="5" placeholder="Describe the role..." class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition" required></textarea>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Requirements</label>
            <textarea id="requirements" rows="4" placeholder="List requirements..." class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></textarea>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Required Skills (Comma separated) *</label>
            <input type="text" id="skills" placeholder="React, Node.js, TypeScript" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none" required>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">Years of Experience</label>
              <input type="text" id="yearsOfExperience" placeholder="e.g. 3-5 years" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none">
            </div>
            <div class="flex flex-col gap-1">
              <label class="text-sm font-semibold text-gray-700">Education</label>
              <input type="text" id="education" placeholder="Bachelor's Degree" class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none">
            </div>
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-semibold text-gray-700">Benefits & Perks</label>
            <textarea id="benefits" rows="3" placeholder="Health insurance, Remote work..." class="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none"></textarea>
          </div>
        </div>
      </div>
    </form>

    <div id="previewMode" class="hidden bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-8 space-y-6">
       </div>

  </main>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Profile - Step 1</title>
    <link rel="stylesheet" href="../../../css/main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        background: #b6cee0;
        background: radial-gradient(
          circle,
          rgba(182, 206, 224, 1) 0%,
          rgba(255, 255, 255, 1) 65%
        );
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 min-h-screen flex items-center justify-center font-sans py-6"
  >
    <a
      href="../../../index.html"
      class="absolute top-4 left-8 flex items-center gap-2 text-gray-600 hover:text-blue-600 font-bold transition-colors mt-6 ml-6 mb-10 group"
    >
      <i
        class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"
      ></i>
      <span>AI-Career Guidance</span>
    </a>
    <main class="w-full max-w-xl bg-white p-6 md:p-8 rounded-2xl shadow-lg m-4">
      <div class="text-center mb-6">
        <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-1">
          Company Information
        </h2>
        <p class="text-gray-500 text-sm">Step 1 of 3: Basic Info</p>
      </div>

      <form id="companyStep1Form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              for="location"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Location *</label
            >
            <div class="relative">
              <select
                id="input-location"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-white text-gray-700 text-sm"
              >
                <option value="" disabled selected>Select location</option>
                <option value="Remote" class="font-bold text-blue-600">
                  🌍 Remote / Anywhere
                </option>

                <optgroup label="Egypt">
                  <option value="Cairo, Egypt">Cairo, Egypt</option>
                  <option value="Giza, Egypt">Giza, Egypt</option>
                  <option value="Alexandria, Egypt">Alexandria, Egypt</option>
                  <option value="Mansoura, Egypt">Mansoura, Egypt</option>
                  <option value="Luxor, Egypt">Luxor, Egypt</option>
                  <option value="Aswan, Egypt">Aswan, Egypt</option>
                  <option value="Asyut, Egypt">Asyut, Egypt</option>
                  <option value="Port Said, Egypt">Port Said, Egypt</option>
                  <option value="Suez, Egypt">Suez, Egypt</option>
                  <option value="Tanta, Egypt">Tanta, Egypt</option>
                </optgroup>

                <optgroup label="Saudi Arabia">
                  <option value="Riyadh, Saudi Arabia">
                    Riyadh, Saudi Arabia
                  </option>
                  <option value="Jeddah, Saudi Arabia">
                    Jeddah, Saudi Arabia
                  </option>
                  <option value="Mecca, Saudi Arabia">
                    Mecca, Saudi Arabia
                  </option>
                  <option value="Medina, Saudi Arabia">
                    Medina, Saudi Arabia
                  </option>
                  <option value="Dammam, Saudi Arabia">
                    Dammam, Saudi Arabia
                  </option>
                  <option value="Khobar, Saudi Arabia">
                    Khobar, Saudi Arabia
                  </option>
                  <option value="Abha, Saudi Arabia">Abha, Saudi Arabia</option>
                  <option value="Tabuk, Saudi Arabia">
                    Tabuk, Saudi Arabia
                  </option>
                  <option value="Hail, Saudi Arabia">Hail, Saudi Arabia</option>
                </optgroup>

                <optgroup label="United Arab Emirates">
                  <option value="Dubai, United Arab Emirates">
                    Dubai, UAE
                  </option>
                  <option value="Abu Dhabi, United Arab Emirates">
                    Abu Dhabi, UAE
                  </option>
                  <option value="Sharjah, United Arab Emirates">
                    Sharjah, UAE
                  </option>
                  <option value="Ajman, United Arab Emirates">
                    Ajman, UAE
                  </option>
                  <option value="Ras Al Khaimah, United Arab Emirates">
                    Ras Al Khaimah, UAE
                  </option>
                  <option value="Fujairah, United Arab Emirates">
                    Fujairah, UAE
                  </option>
                  <option value="Umm Al Quwain, United Arab Emirates">
                    Umm Al Quwain, UAE

                <optgroup label="Jordan">
                  <option value="Amman, Jordan">Amman, Jordan</option>

                  <option value="Irbid, Jordan">Irbid, Jordan</option>
                  <option value="Aqaba, Jordan">Aqaba, Jordan</option>
                  <option value="Madaba, Jordan">Madaba, Jordan</option>
                  <option value="Jerash, Jordan">Jerash, Jordan</option>
                </optgroup>

                <optgroup label="Lebanon">
                  <option value="Beirut, Lebanon">Beirut, Lebanon</option>
                  <option value="Tripoli, Lebanon">Tripoli, Lebanon</option>
                  <option value="Sidon, Lebanon">Sidon, Lebanon</option>

                  <option value="Baalbek, Lebanon">Baalbek, Lebanon</option>

                <optgroup label="Iraq">
                  <option value="Baghdad, Iraq">Baghdad, Iraq</option>

                  <option value="Doha, Qatar">Doha, Qatar</option>
                  <option value="Al Rayyan, Qatar">Al Rayyan, Qatar</option>
                  <option value="Al Wakrah, Qatar">Al Wakrah, Qatar</option>

                  <option value="Umm Salal, Qatar">Umm Salal, Qatar</option>
                </optgroup>

                <optgroup label="Bahrain">
                  <option value="Manama, Bahrain">Manama, Bahrain</option>
                  <option value="Riffa, Bahrain">Riffa, Bahrain</option>
                  <option value="Muharraq, Bahrain">Muharraq, Bahrain</option>
                  <option value="Hamad Town, Bahrain">
                    Hamad Town, Bahrain
                  </option>
                  <option value="Isa Town, Bahrain">Isa Town, Bahrain</option>
                </optgroup>

                <optgroup label="Yemen">
                  <option value="Sana'a, Yemen">Sana'a, Yemen</option>

                <optgroup label="Palestine">
                  <option value="Jerusalem, Palestine">

                </optgroup>

                <optgroup label="Tunisia">
                  <option value="Tunis, Tunisia">Tunis, Tunisia</option>

                  <option value="Sousse, Tunisia">Sousse, Tunisia</option>
                  <option value="Kairouan, Tunisia">Kairouan, Tunisia</option>
                  <option value="Bizerte, Tunisia">Bizerte, Tunisia</option>
                  <option value="Gabes, Tunisia">Gabes, Tunisia</option>
                </optgroup>

                <optgroup label="Algeria">
                  <option value="Algiers, Algeria">Algiers, Algeria</option>
                  <option value="Oran, Algeria">Oran, Algeria</option>
                  <option value="Constantine, Algeria">
                    Constantine, Algeria
                  </option>
                  <option value="Annaba, Algeria">Annaba, Algeria</option>
                  <option value="Blida, Algeria">Blida, Algeria</option>
                  <option value="Batna, Algeria">Batna, Algeria</option>
                </optgroup>

                <optgroup label="Morocco">
                  <option value="Casablanca, Morocco">
                    Casablanca, Morocco
                  </option>
                  <option value="Rabat, Morocco">Rabat, Morocco</option>
                  <option value="Fes, Morocco">Fes, Morocco</option>
                  <option value="Marrakech, Morocco">Marrakech, Morocco</option>
                  <option value="Tangier, Morocco">Tangier, Morocco</option>
                  <option value="Agadir, Morocco">Agadir, Morocco</option>
                  <option value="Meknes, Morocco">Meknes, Morocco</option>
                </optgroup>

                <optgroup label="Sudan">
                  <option value="Khartoum, Sudan">Khartoum, Sudan</option>
                  <option value="Omdurman, Sudan">Omdurman, Sudan</option>
                  <option value="Port Sudan, Sudan">Port Sudan, Sudan</option>
                  <option value="Nyala, Sudan">Nyala, Sudan</option>
                  <option value="Kassala, Sudan">Kassala, Sudan</option>
                </optgroup>

                <optgroup label="Mauritania">
                  <option value="Nouakchott, Mauritania">
                    Nouakchott, Mauritania
                  </option>
                  <option value="Nouadhibou, Mauritania">
                    Nouadhibou, Mauritania
                  </option>
                  <option value="Kiffa, Mauritania">Kiffa, Mauritania</option>
                  <option value="Rosso, Mauritania">Rosso, Mauritania</option>
                </optgroup>

                <optgroup label="Somalia">
                  <option value="Mogadishu, Somalia">Mogadishu, Somalia</option>
                  <option value="Hargeisa, Somalia">Hargeisa, Somalia</option>
                  <option value="Bosaso, Somalia">Bosaso, Somalia</option>
                  <option value="Kismayo, Somalia">Kismayo, Somalia</option>
                  <option value="Berbera, Somalia">Berbera, Somalia</option>
                </optgroup>

                <optgroup label="Djibouti">
                  <option value="Djibouti City, Djibouti">
                    Djibouti City, Djibouti
                  </option>
                  <option value="Ali Sabieh, Djibouti">
                    Ali Sabieh, Djibouti
                  </option>
                  <option value="Tadjoura, Djibouti">Tadjoura, Djibouti</option>
                </optgroup>

                <optgroup label="Comoros">
                  <option value="Moroni, Comoros">Moroni, Comoros</option>
                  <option value="Mutsamudu, Comoros">Mutsamudu, Comoros</option>
                  <option value="Fomboni, Comoros">Fomboni, Comoros</option>
                </optgroup>
              </select>
              <div
                class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500"
              >
                <i class="fas fa-chevron-down text-xs"></i>
              </div>
            </div>
          </div>

          <div>
            <label
              for="industry"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Industry *</label
            >
            <div class="relative">
              <select
                id="industry"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm"
              >
                <option value="" disabled selected>Select industry</option>
                <option value="software-development">
                  Software Development
                </option>
                <option value="web-development">Web Development</option>
                <option value="mobile-development">Mobile Development</option>
                <option value="data-science-analytics">Data Science</option>
                <option value="ai-ml">AI & ML</option>
                <option value="cybersecurity">Cybersecurity</option>
                <option value="cloud-computing">Cloud Computing</option>
              </select>
              <div
                class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500"
              >
                <i class="fas fa-chevron-down text-xs"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              for="foundedYear"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Founded Year *</label
            >
            <input
              type="number"
              id="foundedYear"
              required
              min="1800"
              max="2026"
              placeholder="YYYY"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
            />
          </div>

          <div>
            <label
              for="companySize"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Number of Employees *</label
            >
            <div class="relative">
              <select
                id="numberOfEmployees"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm"
              >
                <option value="" disabled selected>Select range</option>
                <option value="1-10">1-10 Employees</option>
                <option value="11-50">11-50 Employees</option>
                <option value="51-200">51-200 Employees</option>
                <option value="201-500">201-500 Employees</option>
                <option value="500+">500+ Employees</option>
              </select>
              <div
                class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500"
              >
                <i class="fas fa-chevron-down text-xs"></i>
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              for="phone"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Phone (Optional)</label
            >
            <input
              type="tel"
              id="phone"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
            />
          </div>

          <div>
            <label
              for="website"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Website (Optional)</label
            >
            <input
              type="url"
              id="website"
              placeholder="https://example.com"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
            />
          </div>
        </div>

        <div>
          <label
            for="companyDescription"
            class="block text-xs font-bold text-gray-700 mb-1"
            >Description *</label
          >
          <textarea
            id="companyDescription"
            rows="3"
            required
            placeholder="Tell us about your company..."
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
          ></textarea>
        </div>

        <div class="flex gap-3 mt-6 pt-2 border-t border-gray-100">
          <button
            type="submit"
            class="flex-1 bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 shadow-md transition-all flex items-center justify-center gap-2 text-sm"
          >
            <span>continue to Company Details (step 2 of 3)</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </form>
    </main>

    <script
      type="module"
      src="/src/js/controllers/profileStepsController.js"
    ></script>
  </body>
</html>

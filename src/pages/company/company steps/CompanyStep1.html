<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile - Step 1</title>
    <link rel="stylesheet" href="../../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans py-6">

    <main class="w-full max-w-xl bg-white p-6 md:p-8 rounded-2xl shadow-lg m-4">
        
        <div class="text-center mb-6">
            <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-1">Company Information</h2>
            <p class="text-gray-500 text-sm">Step 1 of 3: Basic Info</p>
        </div>

        <form id="companyStep1Form" class="space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="location" class="block text-xs font-bold text-gray-700 mb-1">Location *</label>
                    <input 
                        type="text" 
                        id="location" 
                        required 
                        placeholder="e.g. San Francisco, CA" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
                    >
                </div>

                <div>
                    <label for="industry" class="block text-xs font-bold text-gray-700 mb-1">Industry *</label>
                    <div class="relative">
                        <select id="industry" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm">
                            <option value="" disabled selected>Select industry</option>
                            <option value="software-development">Software Development</option>
                            <option value="web-development">Web Development</option>
                            <option value="mobile-development">Mobile Development</option>
                            <option value="data-science-analytics">Data Science</option>
                            <option value="ai-ml">AI & ML</option>
                            <option value="cybersecurity">Cybersecurity</option>
                            <option value="cloud-computing">Cloud Computing</option>
                            </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="foundedYear" class="block text-xs font-bold text-gray-700 mb-1">Founded Year *</label>
                    <input 
                        type="number" 
                        id="foundedYear" 
                        required 
                        min="1800" 
                        max="2026" 
                        placeholder="YYYY"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
                    >
                </div>

                <div>
                    <label for="companySize" class="block text-xs font-bold text-gray-700 mb-1">Number of Employees *</label>
                    <div class="relative">
                        <select id="numberOfEmployees" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm">
                            <option value="" disabled selected>Select range</option>
                            <option value="1-10">1-10 Employees</option>
                            <option value="11-50">11-50 Employees</option>
                            <option value="51-200">51-200 Employees</option>
                            <option value="201-500">201-500 Employees</option>
                            <option value="500+">500+ Employees</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="phone" class="block text-xs font-bold text-gray-700 mb-1">Phone (Optional)</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
                    >
                </div>

                <div>
                    <label for="website" class="block text-xs font-bold text-gray-700 mb-1">Website (Optional)</label>
                    <input 
                        type="url" 
                        id="website" 
                        placeholder="https://example.com" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
                    >
                </div>
            </div>

            <div>
                <label for="companyDescription" class="block text-xs font-bold text-gray-700 mb-1">Description *</label>
                <textarea 
                    id="companyDescription" 
                    rows="3" 
                    required 
                    placeholder="Tell us about your company..." 
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm "
                ></textarea>
            </div>

            <div class="flex gap-3 mt-6 pt-2 border-t border-gray-100">
                <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 shadow-md transition-all flex items-center justify-center gap-2 text-sm">
                    <span>continue to Company Details (step 2 of 3)</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

        </form>
    </main>

<script type="module" src="/src/js/controllers/profileStepsController.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Profile - Step 2</title>
    <link rel="stylesheet" href="../../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans py-6">

    <main class="w-full max-w-xl bg-white p-6 rounded-2xl shadow-lg m-4">
        
        <div class="text-center mb-5">
            <h2 class="text-xl font-bold text-gray-800 mb-1">Company Details</h2>
            <p class="text-gray-500 text-xs">Step 2 of 3: Tech Stack & Benefits</p>
        </div>

        <form id="companyStep2Form" class="space-y-4">
            
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">
                    Technologies We Use * <span class="text-gray-400 font-normal">(Minimum 3 required)</span>
                </label>
                
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="techInput" 
                        placeholder="e.g. React, Python" 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm bg-gray-50"
                    >
                    <button 
                        type="button" 
                        id="addTechBtn" 
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors text-xs font-bold uppercase tracking-wide shadow-sm"
                    >
                        Add
                    </button>
                </div>

                <div id="techTagsContainer" class="flex flex-wrap gap-2 mt-2"></div>
                
                <small id="techCounter" class="text-orange-500 font-bold text-xs mt-1 block">
                    0 of 3 added
                </small>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">
                    Benefits & Perks (Optional)
                </label>
                
                <div class="flex gap-2">
                    <input 
                        type="text" 
                        id="benefitInput" 
                        placeholder="e.g. Remote Work" 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent text-sm bg-gray-50"
                    >
                    <button 
                        type="button" 
                        id="addBenefitBtn" 
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors text-xs font-bold uppercase tracking-wide shadow-sm"
                    >
                        Add
                    </button>
                </div>

                <div id="benefitTagsContainer" class="flex flex-wrap gap-2 mt-2"></div>
            </div>

            <hr class="border-gray-100 my-3">

            <div>
                <h3 class="text-xs font-bold text-gray-800 mb-2 uppercase tracking-wide">Social Media Links (Optional)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">LinkedIn</label>
                        <input type="url" id="linkedin" placeholder="linkedin.com/..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-sm">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Twitter</label>
                        <input type="url" id="twitter" placeholder="twitter.com/..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-sm">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Facebook</label>
                        <input type="url" id="facebook" placeholder="facebook.com/..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-sm">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Instagram</label>
                        <input type="url" id="instagram" placeholder="instagram.com/..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-sm">
                    </div>
                </div>
            </div>

            <div class="flex gap-3 pt-3 border-t border-gray-100 mt-2">
                <button type="button" id="backBtn" class="px-4 py-2 border border-gray-300 text-gray-600 font-bold rounded-lg hover:bg-gray-200 text-xs transition-colors">
                    Back
                </button>

                <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 shadow-md transition-all flex items-center justify-center gap-2 text-sm">
                    <span>Continue to Verification (Step 3 of 3)</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

        </form>
    </main>

    <script type="module" src="/src/js/controllers/profileStepsController.js"></script>
    
    <style>
        .tag {
            background-color: #dbeafe; 
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 9999px;
            font-size: 0.75em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }
        .tag-close {
            cursor: pointer;
            font-weight: bold;
            color: #60a5fa;
            font-size: 1.1em;
        }
        .tag-close:hover {
            color: #ef4444;
        }
    </style>
</body>
</html>

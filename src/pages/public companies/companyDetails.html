<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Details - CareerPro</title>

    <link href="/src/css/main.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      body {
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body>
    
        <div class="mt-6 w-3/4 mx-auto flex items-center justify-between">
            <a href="companies.html" class="group flex items-center gap-2 text-slate-500 hover:text-blue-600 transition-colors">
                    <i class="fa-solid fa-arrow-left text-sm group-hover:-translate-x-1 transition-transform"></i>
                <span class="font-medium text-sm">Back to Companies</span>
            </a>
        </div>
        
    <main class="w-3/4 mx-auto px-4 py-8 min-h-screen">
        
        <div id="details-loader" class="flex flex-col items-center justify-center py-20">
            <i class="fas fa-circle-notch fa-spin text-4xl text-blue-600"></i>
            <p class="mt-4 text-slate-500">Loading company details...</p>
        </div>

        <div id="details-content" class="hidden space-y-6">
            
            <div id="detail-verified-alert" class="hidden bg-orange-50 border border-orange-100 rounded-xl p-4 flex items-start gap-3">
                <i class="fa-solid fa-triangle-exclamation text-orange-500 mt-1"></i>
                <div>
                    <h4 class="text-orange-800 font-semibold text-sm">Verification Pending</h4>
                    <p class="text-orange-600 text-xs mt-1">This company has not completed the verification process yet.</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full -mr-10 -mt-10 opacity-50"></div>
                
                <div class="flex flex-col md:flex-row gap-6 items-start relative z-10">
                    <div class="w-24 h-24 rounded-2xl bg-white shadow-md border border-slate-100 flex items-center justify-center overflow-hidden shrink-0">
                        <img id="detail-logo" src="" alt="Logo" class="w-full h-full object-cover hidden">
                        <span id="detail-initial" class="text-3xl font-bold text-blue-600">C</span>
                    </div>

                    <div class="flex-1 w-full">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h1 id="detail-name" class="text-3xl font-bold text-slate-900">Company Name</h1>
                                <div class="flex items-center gap-2 mt-2 text-sm text-slate-500">
                                    <i class="fa-solid fa-layer-group text-blue-500"></i>
                                    <span id="detail-industry">Industry</span>
                                </div>
                            </div>
                            <a id="detail-website" href="#" target="_blank" class="hidden px-5 py-2.5 bg-slate-900 text-white hover:bg-slate-800 rounded-lg text-sm font-medium transition shadow-lg shadow-slate-200">
                                Visit Website <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-xs"></i>
                            </a>
                        </div>

                        <div class="flex flex-wrap gap-4 mt-6 pt-6 border-t border-slate-100">
                            <div class="flex items-center gap-2 text-sm text-slate-600 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                                <i class="fa-solid fa-location-dot text-slate-400"></i>
                                <span id="detail-location">Location</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-slate-600 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                                <i class="fa-solid fa-users text-slate-400"></i>
                                <span id="detail-size">Size</span>
                            </div>
                            <div class="flex items-center gap-2 text-sm text-slate-600 bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-100">
                                <i class="fa-regular fa-calendar text-slate-400"></i>
                                Founded <span id="detail-founded">Year</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
                            <i class="fa-regular fa-file-lines text-blue-500"></i> About
                        </h3>
                        <p id="detail-desc" class="text-slate-500 text-sm leading-relaxed mb-6">
                            Loading description...
                        </p>
                        
                        <h4 class="font-semibold text-slate-800 text-sm mb-3">Benefits</h4>
                        <div id="detail-benefits" class="flex flex-wrap gap-2">
                            </div>
                    </div>
                </div>

                <div class="lg:col-span-2">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-briefcase text-blue-500"></i> Open Positions
                            </h3>
                            <span id="detail-jobs-count" class="bg-blue-100 text-blue-700 text-xs font-bold px-2 py-1 rounded-md">0</span>
                        </div>

                        <div id="detail-jobs-list" class="space-y-4">
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../../js/utils/axiosClient.js"></script>
    <script type="module" src="../../js/config/constant.js"></script>
    <script type="module" src="../../js/controllers/companyDetailsController.js"></script>
  </body>
</html>

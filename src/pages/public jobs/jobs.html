/* From Uiverse.io by zenonaiden_3341 */ 
.toggleSwitch {
  width: 56px;
  height: 56px;
  display: grid;
  border-radius: 50%;
  position: relative;
  place-items: center;
  cursor: pointer;
  transition: transform 0.2s ease;
  line-height: 1;
  overflow: hidden;
}

#checkboxInput {
  display: none;
}

.icons {
  grid-column: 1 / 1;
  grid-row: 1 / 1;
  width: 80%;
  height: 80%;
  display: grid;
  place-items: center;
  z-index: 2;
  transform-origin: center center;
  transition:
    transform 500ms ease,
    opacity 300ms ease;
  opacity: 0;
  pointer-events: none;
}

.icons--moon {
  color: #212121;
  /* background-color: #e8e8e8; */
  border-radius: 50%;
}
.icons--sun {
  color: #ffa600;
  border-radius: 50%;
}
.dark .icons--sun {
  color: #ffa600;
  filter: drop-shadow(0 0 5px #ffa600) drop-shadow(0 0 8px rgba(255, 166, 0, 0.6));
}
.icons--moon,
.icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--sun {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:not(:checked) + .toggleSwitch .icons--moon {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:checked + .toggleSwitch .icons--moon {
  transform: rotate(360deg) scale(1);
  opacity: 1;
}

#checkboxInput:checked + .toggleSwitch .icons--sun {
  transform: rotate(0deg) scale(0);
  opacity: 0;
}

#checkboxInput:active + .toggleSwitch {
  transform: scale(0.94);
}
.icons svg {
  fill: currentColor !important;
}
@media (max-width: 639px) {
  .logout-container {
    min-width: fit-content;
  }
}

          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
        >
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
        <h2 class="text-xl font-bold text-slate-900 dark:text-slate-200">Apply for Job</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
          Submit your application and CV for this position
        </p>
      </div>

      <form id="applyForm" class="p-6 pt-2 space-y-4" novalidate>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1"
              >Full Name <span class="text-red-500">*</span></label
            >
            <input
              type="text"
              id="applyName"
              placeholder="Enter your full name"
              class="w-full px-3 py-2 dark:text-white border border-slate-300 rounded-lg dark:bg-black/30 dark:focus:border-slate-200 dark:focus:ring-white/50 dark:caret-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
              required
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1"
              >Email <span class="text-red-500">*</span></label
            >
            <input
              type="email"
              id="applyEmail"
              placeholder="Enter your email"
              class="w-full px-3 py-2 border dark:text-white border-slate-300 rounded-lg dark:bg-black/30 dark:focus:border-slate-200 dark:focus:ring-white/50 dark:caret-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1"
            >Phone Number</label
          >
          <input
            type="tel"
            id="applyPhone"
            placeholder="Enter your phone number"
            class="w-full px-3 py-2 border dark:text-white border-slate-300 rounded-lg dark:bg-black/30 dark:focus:border-slate-200 dark:focus:ring-white/50 dark:caret-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1"
            >Upload CV/Resume <span class="text-red-500">*</span></label
          >
          <div
            class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 dark:hover:bg-black/30 transition-colors cursor-pointer group"
            onclick="document.getElementById('applyCv').click()"
          >
            <div
              class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-white transition-colors"
            >
              <i class="fa-solid fa-arrow-up-from-bracket text-slate-500"></i>
            </div>
            <p class="text-sm text-slate-600 dark:text-slate-500 font-medium">
              Drag and drop your CV here or click to browse
            </p>
            <p class="text-xs text-slate-400 mt-1">
              Supported formats: PDF, DOC, DOCX (Max 5MB)
            </p>
            <button
              type="button"
              class="mt-4 bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-800 text-white text-xs font-bold py-2 px-4 rounded-lg transition-colors"
            >
              Choose File
            </button>
            <input type="file" id="applyCv" class="hidden" required />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-200 mb-1"
            >Cover Letter (Optional)</label
          >
          <textarea
            id="applyCover"
            rows="3"
            class="w-full px-3 py-2 dark:bg-black/30 border dark:caret-white dark:focus:border-slate-200 dark:focus:ring-white/50 border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 dark:text-white resize-none"
          ></textarea>
        </div>
        <div class="flex gap-3 pt-2 -mt-30">
          <button
            type="button"
            id="btnCancelModal"
            class="flex-1 py-2 border border-slate-400 hover:border-slate-200 dark:text-slate-400 hover:dark:text-slate-200 transition-colors rounded-lg text-sm"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-800 text-white transition-colors rounded-lg text-sm"
          >
            Submit Application
          </button>
        </div>
      </form>
    </div>
  </div>
    <script type="module" src="../../js/utils/authGuard.js"></script>
    <script type="module" src="../../js/config/constant.js"></script>
    <script type="module" src="../../js/utils/axiosClient.js"></script>
    <script type="module" src="../../js/services/jobService.js"></script>
    <script type="module" src="../../js/controllers/homeController.js"></script>
    <script
      type="module"
      src="../../js/controllers/allJobsController.js"
    ></script>
  </body>
</html>

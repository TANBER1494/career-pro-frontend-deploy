    <div
      id="applyModal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/60 backdrop-blur-sm transition-opacity duration-300"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 md:max-w-xl relative transform transition-all scale-100 overflow-y-auto max-h-[90vh]"
      >
        <div class="p-6 pb-2 text-center">
          <button
            id="btnCloseModal"
            class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
          >
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
          <h2 class="text-xl font-bold text-slate-900">Apply for Job</h2>
          <p class="text-sm text-slate-500 mt-1">
            Submit your application and CV for this position
          </p>
        </div>

        <form id="applyForm" class="p-6 pt-2 space-y-4" novalidate>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1"
                >Full Name <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                id="applyName"
                placeholder="Enter your full name"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                required
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1"
                >Email <span class="text-red-500">*</span></label
              >
              <input
                type="email"
                id="applyEmail"
                placeholder="Enter your email"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                required
              />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1"
              >Phone Number</label
            >
            <input
              type="tel"
              id="applyPhone"
              placeholder="Enter your phone number"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1"
              >Upload CV/Resume <span class="text-red-500">*</span></label
            >
            <div
              class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition-colors cursor-pointer group"
              onclick="document.getElementById('applyCv').click()"
            >
              <div
                class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-white transition-colors"
              >
                <i class="fa-solid fa-arrow-up-from-bracket text-slate-500"></i>
              </div>
              <p class="text-sm text-slate-600 font-medium">
                Drag and drop your CV here or click to browse
              </p>
              <p class="text-xs text-slate-400 mt-1">
                Supported formats: PDF, DOC, DOCX (Max 5MB)
              </p>
              <button
                type="button"
                class="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded-lg transition-colors"
              >
                Choose File
              </button>
              <input type="file" id="applyCv" class="hidden" required />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1"
              >Cover Letter (Optional)</label
            >
            <textarea
              id="applyCover"
              rows="3"
              class="w-full px-3 py-2 -mb-4 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>
          <div class="flex gap-3 pt-2 ">
            <button
              type="button"
              id="btnCancelModal"
              class="flex-1 py-2 border border-slate-300 rounded-lg text-sm"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm"
            >
              Submit Application
            </button>
          </div>
        </form>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Jobs - CareerPro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="website icon" type="png" href="../../../assets/imgs/Logo.png"/>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");
      body.loaded {
        opacity: 1;
      }
      body {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        font-family: "Poppins", sans-serif;
        background: #dce0e0;
        background: linear-gradient(
          150deg,
          rgba(220, 224, 224, 1) 14%,
          rgba(182, 206, 224, 1) 60%,
          rgba(95, 106, 115, 1) 100%
        );
        margin: 0;
        overflow-x: hidden;
        background-attachment: fixed;
      }
    </style>
  </head>
  <body class="font-poppins text-slate-800 flex flex-col min-h-screen">
    <main class="w-full px-6 lg:px-10 py-8 min-h-screen">
      <div class="flex items-center gap-5 mb-4">
        <a
      id="backBtn"
      href="index.html"
      class="flex w-fit items-center text-slate-500 hover:text-blue-600 transition-colors mt-6 ml-6 mb-8 group"
    >
      <i
        class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"
      ></i>
      <span class="text-sm font-medium">Back</span>
    </a>
        <h1 class="text-3xl font-poppins font-medium text-slate-900">
          All Jobs
        </h1>
        <p class="text-slate-500 mt-1" id="jobs-count">
          Loading available positions...
        </p>
      </div>

      <div
        class="relative bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center"
      >
        <div class="relative flex-grow w-full md:w-auto">
          <input
            type="text"
            id="search-input"
            placeholder="Search jobs..."
            class="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-lg focus:border-blue-500 outline-none transition-all duration-300 peer"
          />
          <i
            class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 peer-focus:text-blue-500 peer-focus:scale-125 transition-all duration-300 pointer-events-none"
          ></i>
        </div>

        <div class="w-full md:w-1/4">
          <select
            id="filter-location"
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-600 bg-white"
          >
            <option value="">All Locations</option>
            <option value="San Francisco">San Francisco, CA</option>
            <option value="New York">New York, NY</option>
            <option value="Austin">Austin, TX</option>
            <option value="Seattle">Seattle, WA</option>
            <option value="Boston">Boston, MA</option>
            <option value="Cairo">Cairo, EG</option>
          </select>
        </div>

        <div class="w-full md:w-1/4">
          <select
            id="filter-type"
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-600 bg-white"
          >
            <option value="">All Types</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Contract">Contract</option>
            <option value="Internship">Internship</option>
          </select>
        </div>

        <div class="w-full md:w-1/4">
          <select
            id="filter-experience"
            class="w-full px-4 py-2.5 border border-slate-200 rounded-lg focus:outline-none focus:border-blue-500 text-sm text-slate-600 bg-white"
          >
            <option value="">All Experience</option>
            <option value="Entry-level">Entry Level</option>
            <option value="Mid-level">Mid Level</option>
            <option value="Senior-level">Senior Level</option>
            <option value="Executive">Executive</option>
          </select>
        </div>
      </div>

      <div
        id="jobs-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
      >
        <div class="col-span-full text-center py-12">
          <i class="fas fa-spinner fa-spin text-4xl text-blue-500"></i>
          <p class="mt-2 text-slate-500">Searching for jobs...</p>
        </div>
      </div>

      <div id="pagination-container" class="mt-8 flex justify-between"></div>
    </main>

    <div
      id="applyModal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gray-900/60 backdrop-blur-sm transition-opacity duration-300"
    >
      <div
        class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 md:max-w-xl relative transform transition-all scale-100 overflow-y-auto max-h-[90vh]"
      >
        <div class="p-6 pb-2 text-center">
          <button
            id="btnCloseModal"
            class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors"
          >
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
          <h2 class="text-xl font-bold text-slate-900">Apply for Job</h2>
          <p class="text-sm text-slate-500 mt-1">
            Submit your application and CV for this position
          </p>
        </div>

        <form id="applyForm" class="p-6 pt-2 space-y-4" novalidate>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1"
                >Full Name <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                id="applyName"
                placeholder="Enter your full name"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                required
              />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1"
                >Email <span class="text-red-500">*</span></label
              >
              <input
                type="email"
                id="applyEmail"
                placeholder="Enter your email"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                required
              />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1"
              >Phone Number</label
            >
            <input
              type="tel"
              id="applyPhone"
              placeholder="Enter your phone number"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1"
              >Upload CV/Resume <span class="text-red-500">*</span></label
            >
            <div
              class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition-colors cursor-pointer group"
              onclick="document.getElementById('applyCv').click()"
            >
              <div
                class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-white transition-colors"
              >
                <i class="fa-solid fa-arrow-up-from-bracket text-slate-500"></i>
              </div>
              <p class="text-sm text-slate-600 font-medium">
                Drag and drop your CV here or click to browse
              </p>
              <p class="text-xs text-slate-400 mt-1">
                Supported formats: PDF, DOC, DOCX (Max 5MB)
              </p>
              <button
                type="button"
                class="mt-4 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded-lg transition-colors"
              >
                Choose File
              </button>
              <input type="file" id="applyCv" class="hidden" required />
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1"
              >Cover Letter (Optional)</label
            >
            <textarea
              id="applyCover"
              rows="3"
              class="w-full px-3 py-2 -mb-4 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>
          <div class="flex gap-3 pt-2 ">
            <button
              type="button"
              id="btnCancelModal"
              class="flex-1 py-2 border border-slate-300 rounded-lg text-sm"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm"
            >
              Submit Application
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../../js/config/constant.js"></script>
    <script type="module" src="../../js/utils/axiosClient.js"></script>
    <script type="module" src="../../js/services/jobService.js"></script>
    <script type="module" src="../../js/controllers/homeController.js"></script>
    <script
      type="module"
      src="../../js/controllers/allJobsController.js"
    ></script>
  </body>
</html>

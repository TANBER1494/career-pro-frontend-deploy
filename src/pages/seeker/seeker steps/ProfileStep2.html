<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Step 2 - Career Guidance</title>
    <link rel="stylesheet" href="../../../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans py-6">

    <main class="w-full max-w-xl bg-white p-6 md:p-8 rounded-2xl shadow-lg m-4">
        
        <div class="text-center mb-6">
            <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-1">Education & Preferences</h2>
            <p class="text-gray-500 text-sm">Step 2 of 3</p>
        </div>

        <form id="step2Form" class="space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="degree" class="block text-xs font-bold text-gray-700 mb-1">Degree *</label>
                    <div class="relative">
                        <select id="degree" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm">
                            <option value="" disabled selected>Select degree</option>
                            <option value="Associate">Associate Degree</option>
                            <option value="Bachelor">Bachelor's Degree</option>
                            <option value="Master">Master's Degree</option>
                            <option value="PhD">PhD</option>
                            <option value="HighSchool">High School</option>
                            <option value="other">Other</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="graduationYear" class="block text-xs font-bold text-gray-700 mb-1">Graduation Year *</label>
                    <input 
                        type="number" 
                        id="graduationYear" 
                        required 
                        min="1950" 
                        max="2030" 
                        placeholder="Select year" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="university" class="block text-xs font-bold text-gray-700 mb-1">University *</label>
                    <input 
                        type="text" 
                        id="university" 
                        required 
                        placeholder="e.g. Cairo University" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
                    >
                </div>

                <div>
                    <label for="gpa" class="block text-xs font-bold text-gray-700 mb-1">GPA (Optional)</label>
                    <input 
                        type="number" 
                        id="gpa" 
                        step="0.01" 
                        min="0" 
                        max="5" 
                        placeholder="e.g. 3.5" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="jobType" class="block text-xs font-bold text-gray-700 mb-1">Job Type *</label>
                    <div class="relative">
                        <select id="jobType" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm">
                            <option value="" disabled selected>Select job type</option>
                            <option value="full_time">Full Time</option>
                            <option value="part_time">Part Time</option>
                            <option value="internship">Internship</option>
                            <option value="Freelance">Freelance / Project</option>
                            <option value="Shift_Based">Shift Based</option>
                            <option value="Volunteering">Volunteering</option>
                            <option value="Student_Activity">Student Activity</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="workplaceSetting" class="block text-xs font-bold text-gray-700 mb-1">Workplace Setting *</label>
                    <div class="relative">
                        <select id="workplaceSetting" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm">
                            <option value="" disabled selected>Select setting</option>
                            <option value="on_site">On-Site</option>
                            <option value="remote">Remote</option>
                            <option value="hybrid">Hybrid</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 mt-6 pt-2 border-t border-gray-100">
                <button type="button" id="backBtn" class="px-5 py-2.5 border border-gray-300 text-gray-600 font-bold rounded-lg hover:bg-gray-200 text-sm transition-colors">
                    Back
                </button>

                <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 shadow-md transition-all flex items-center justify-center gap-2 text-sm">
                    <span>continue to CV Upload (step 3 of 3)</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>

        </form>
    </main>

    <script type="module" src="../../js/jobSeeker.js"></script>
</body>
</html>

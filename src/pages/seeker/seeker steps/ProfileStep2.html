<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Step 2</title>
    <link rel="stylesheet" href="../../../css/main.css" />
    <link rel="website icon" type="png" href="../../../../assets/imgs/Logo.png"/>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body{
        background: #B6CEE0;
        background: radial-gradient(circle, rgba(182, 206, 224, 1) 0%, rgba(255, 255, 255, 1) 65%);
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 min-h-screen flex items-center justify-center font-sans py-6"
  >
  <a
      href="../../../index.html"
      class="absolute top-4 left-8 flex items-center gap-2 text-gray-600 hover:text-blue-600 font-bold transition-colors mt-6 ml-6 mb-10 group "
    >
      <i class="fa-solid fa-arrow-left mr-2 text-sm group-hover:-translate-x-1 transition-transform"></i>
      <span>AI-Career Guidance</span>
    </a>
    <main class="w-full max-w-xl bg-white p-6 md:p-8 rounded-2xl shadow-lg m-4">
      <div class="text-center mb-6">
        <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-1">
          Education & Preferences
        </h2>
        <p class="text-gray-500 text-sm">Step 2 of 3</p>
      </div>

      <form id="step2Form" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              for="degree"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Degree *</label
            >
            <select
              id="degree"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm"
            >
              <option value="" disabled selected>Select degree</option>
              <option value="Bachelor">Bachelor's Degree</option>
              <option value="Master">Master's Degree</option>
              <option value="PhD">PhD</option>
              <option value="High School">High School</option>
            </select>
          </div>

          <div>
            <label
              for="graduationYear"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Graduation Year *</label
            >
            <input
              type="number"
              id="graduationYear"
              required
              min="1970"
              max="2030"
              placeholder="2024"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
            />
          </div>
        </div>

        <div>
          <label
            for="university"
            class="block text-xs font-bold text-gray-700 mb-1"
            >University *</label
          >
          <input
            type="text"
            id="university"
            required
            placeholder="e.g. Cairo University"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-gray-700 text-sm"
          />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label
              for="jobType"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Job Type *</label
            >
            <select
              id="jobType"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm"
            >
              <option value="" disabled selected>Select type</option>
              <option value="Full Time">Full Time</option>
              <option value="Part Time">Part Time</option>
              <option value="Contract">Contract</option>
              <option value="Internship">Internship</option>
            </select>
          </div>

          <div>
            <label
              for="workplaceSetting"
              class="block text-xs font-bold text-gray-700 mb-1"
              >Workplace *</label
            >
            <select
              id="workplaceSetting"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none bg-gray-50 text-gray-700 text-sm"
            >
              <option value="" disabled selected>Select setting</option>
              <option value="on_site">On-Site</option>
              <option value="remote">Remote</option>
              <option value="hybrid">Hybrid</option>
            </select>
          </div>
        </div>

        <div class="flex gap-3 mt-6 pt-2 border-t border-gray-100">
          <button type="button" id="backBtn" class="px-4 py-2 border border-gray-300 text-gray-600 font-bold rounded-lg hover:bg-gray-200 text-xs transition-colors">
            Back
          </button>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-blue-700 shadow-md transition-all flex items-center justify-center gap-2 text-sm"
          >
            <span>Continue to CV Upload (Step 3)</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>
      </form>
    </main>

    <script type="module" src="/src/js/config/constant.js"></script>
    <script type="module" src="/src/js/utils/axiosClient.js"></script>
    <script type="module" src="/src/js/services/seekerService.js"></script>
    <script
      type="module"
      src="/src/js/controllers/profileStepsController.js"
    ></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test Companies API</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body {
        padding: 20px;
        font-family: monospace;
        background: #f0f0f0;
      }
      #output {
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <button onclick="checkCompanies()">Check Companies Data</button>
    <div id="output">Waiting...</div>

    <script type="module">
      import { companyDiscoveryService } from "./src/js/services/companyDiscoveryService.js";

      window.checkCompanies = async () => {
        const out = document.getElementById("output");
        out.textContent = "Loading...";
        try {
          // نجلب الشركات
          const res = await companyDiscoveryService.getAllCompanies({
            limit: 1,
          });
          const company = res.data.companies[0];

          console.log("🔥 FULL COMPANY OBJECT:", company);

          out.innerHTML = `
                <strong>Company Name:</strong> ${company.companyName}
                <strong>openPositionsCount:</strong> ${
                  company.openPositionsCount
                } (Type: ${typeof company.openPositionsCount})
                <strong>jobsCount:</strong> ${company.jobsCount}
                <strong>openPositions (Array):</strong> ${
                  Array.isArray(company.openPositions)
                    ? company.openPositions.length
                    : "Not an Array"
                }
                
                ⬇️ Raw Object ⬇️
                ${JSON.stringify(company, null, 2)}
                `;
        } catch (e) {
          out.textContent = "Error: " + e.message;
          console.error(e);
        }
      };
    </script>
  </body>
</html>

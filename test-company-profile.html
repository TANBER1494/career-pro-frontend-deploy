<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test Company Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        line-height: 1.6;
      }
      .section {
        border: 1px solid #ccc;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 5px;
      }
      button {
        cursor: pointer;
        padding: 5px 10px;
        background: #6f42c1;
        color: white;
        border: none;
        border-radius: 3px;
      }
      input,
      select {
        padding: 5px;
        margin: 5px 0;
      }
      #output {
        background: #f4f4f4;
        padding: 15px;
        border: 1px solid #ddd;
        max-height: 300px;
        overflow: auto;
      }
      .status {
        font-weight: bold;
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h2>🏢 Company Profile Test Bench</h2>

    <div class="section" style="background-color: #f3e5f5">
      <h3>0. Authentication (Company Account)</h3>
      <input
        type="email"
        id="email"
        placeholder="Email"
        value="company@test.com"
      />
      <input
        type="password"
        id="password"
        placeholder="Password"
        value="password123"
      />
      <button id="btnLogin">Login as Company</button>
      <span id="authStatus" class="status" style="color: red"
        >Not Logged In</span
      >
    </div>

    <div class="section">
      <h3>1. Update Basic Info (Step 1)</h3>
      <button id="btnStep1">Send Step 1 Data</button>
      <small>(Location, Industry, Size...)</small>
    </div>

    <div class="section">
      <h3>2. Update Details (Step 2)</h3>
      <button id="btnStep2">Send Step 2 Data</button>
      <small>(Technologies, Benefits, Social...)</small>
    </div>

    <div class="section">
      <h3>3. Uploads</h3>
      <label>Verification Doc (PDF):</label>
      <input type="file" id="docInput" /><br />
      <button id="btnStep3">Upload Verification Doc</button>
      <br />
      <hr />
      <br />
      <label>Company Logo (Image):</label>
      <input type="file" id="logoInput" /><br />
      <button id="btnLogo">Upload Logo</button>
    </div>

    <div class="section">
      <h3>4. Verify Data</h3>
      <button id="btnGetProfile">Get Full Profile</button>
    </div>

    <h3>Console Output:</h3>
    <pre id="output">Waiting...</pre>

    <script type="module">
      import { authService } from "./src/js/services/authService.js";
      import { companyService } from "./src/js/services/companyService.js";

      const log = (data) => {
        document.getElementById("output").textContent = JSON.stringify(
          data,
          null,
          2
        );
        console.log(data);
      };

      // 0. Login
      document
        .getElementById("btnLogin")
        .addEventListener("click", async () => {
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          try {
            const res = await authService.login({ email, password });
            if (res.data.user.accountType !== "company") {
              alert("Warning: This is NOT a company account!");
            }
            document.getElementById("authStatus").textContent = "Logged In ✅";
            document.getElementById("authStatus").style.color = "green";
            log(res);
          } catch (err) {
            log(err);
          }
        });

      // 1. Step 1
      document
        .getElementById("btnStep1")
        .addEventListener("click", async () => {
          const data = {
            location: "Alexandria, Egypt",
            industry: "Software Development",
            foundedYear: 2020,
            numberOfEmployees: "51-200",
            phone: "+20122222222",
            website: "https://tech-corp.com",
            companyDescription: "We build future tech.",
          };
          try {
            const res = await companyService.updateProfileStep1(data);
            log(res);
          } catch (err) {
            log(err);
          }
        });

      // 2. Step 2
      document
        .getElementById("btnStep2")
        .addEventListener("click", async () => {
          const data = {
            technologies: ["Node.js", "React", "MongoDB"],
            benefits: ["Remote Work", "Medical Insurance"],
            linkedin: "https://linkedin.com/company/tech",
            twitter: "https://twitter.com/tech",
          };
          try {
            const res = await companyService.updateProfileStep2(data);
            log(res);
          } catch (err) {
            log(err);
          }
        });

      // 3. Verification Doc
      document
        .getElementById("btnStep3")
        .addEventListener("click", async () => {
          const fileInput = document.getElementById("docInput");
          if (fileInput.files.length === 0)
            return alert("Select PDF file first");

          try {
            const res = await companyService.uploadVerificationDoc(
              fileInput.files[0]
            );
            log(res);
          } catch (err) {
            log(err);
          }
        });

      // 4. Upload Logo
      document.getElementById("btnLogo").addEventListener("click", async () => {
        const fileInput = document.getElementById("logoInput");
        if (fileInput.files.length === 0)
          return alert("Select Image file first");

        try {
          const res = await companyService.uploadLogo(fileInput.files[0]);
          log(res);
        } catch (err) {
          log(err);
        }
      });

      // 5. Get Profile
      document
        .getElementById("btnGetProfile")
        .addEventListener("click", async () => {
          try {
            const res = await companyService.getProfile();
            log(res);
          } catch (err) {
            log(err);
          }
        });
    </script>
  </body>
</html>
